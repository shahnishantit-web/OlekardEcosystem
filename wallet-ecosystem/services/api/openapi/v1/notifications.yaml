openapi: 3.1.0
info:
  title: Notifications API
  version: "1.0.0"
  description: |
    E17 Notification endpoints — in-app inbox and preference management.
    All endpoints require `Authorization: Bearer <sanctum-token>`.

paths:
  /api/v1/notifications/inbox:
    get:
      summary: List in-app notifications for the authenticated user
      operationId: listNotifications
      tags: [Notifications]
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - name: category
          in: query
          schema:
            type: string
            enum: [financial, security, operational, marketing]
      responses:
        "200":
          description: Paginated notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationSummary"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/inbox/unread-count:
    get:
      summary: Get unread notification count
      operationId: getUnreadCount
      tags: [Notifications]
      security:
        - sanctum: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/inbox/{id}:
    get:
      summary: Get a single notification
      operationId: getNotification
      tags: [Notifications]
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/inbox/read:
    patch:
      summary: Mark notifications as read
      operationId: markNotificationsRead
      tags: [Notifications]
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Count of notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      marked_count:
                        type: integer
                        description: Number of notifications marked as read
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/preferences:
    get:
      summary: Get notification preferences for the authenticated user
      operationId: getNotificationPreferences
      tags: [Notification Preferences]
      security:
        - sanctum: []
      responses:
        "200":
          description: Current notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      tags: [Notification Preferences]
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferenceRequest"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationPreference"
        "422":
          description: Validation error or mandatory category required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum: [MANDATORY_CATEGORY_REQUIRED]
                          message:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    NotificationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notification_type:
          type: string
          example: payment.qr.received
        category:
          type: string
          enum: [financial, security, operational, marketing]
        subject:
          type: string
        body:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, notification_type, category, subject, body, read, created_at]

    NotificationDetail:
      allOf:
        - $ref: "#/components/schemas/NotificationSummary"
        - type: object
          properties:
            mandatory:
              type: boolean

    NotificationPreference:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        push_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
        sms_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
        email_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
        marketing_opted_in:
          type: boolean
        updated_at:
          type: string
          format: date-time

    UpdateNotificationPreferenceRequest:
      type: object
      properties:
        push_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
          description: Must include both financial and security if provided
        sms_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
        email_enabled_categories:
          type: array
          items:
            type: string
            enum: [financial, security, operational, marketing]
        marketing_opted_in:
          type: boolean

    MarkReadRequest:
      type: object
      description: Provide either ids or mark_all=true, not both
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          nullable: true
        mark_all:
          type: boolean
          nullable: true

    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          minimum: 0

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
