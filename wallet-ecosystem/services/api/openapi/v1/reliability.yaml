openapi: 3.1.0
info:
  title: Reliability & Transaction Integrity API
  version: 1.0.0
  description: |
    E27 Reliability & Transaction Integrity — admin-facing reliability management endpoints.

    Covers:
    - US4: Dead-letter item visibility, replay, and dismissal
    - US2: Ledger integrity snapshot history

    ## Authentication

    All endpoints require JWT Bearer authentication (`identity.auth` middleware) and the
    `operations.dead_letter.manage` permission.

servers:
  - url: /v1/operations
    description: Operations API base path

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DeadLetterItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operation_type:
          type: string
          example: funding.initiation
        source_id:
          type: string
          format: uuid
        payload:
          type: object
          description: Operation payload (PII fields masked)
        failure_reason:
          type: string
        retry_count:
          type: integer
        retry_history:
          type: array
          items:
            type: object
          description: Only included in single-item show responses
        status:
          type: string
          enum: [pending, replayed, dismissed]
        replayed_at:
          type: string
          format: date-time
          nullable: true
        replayed_by:
          type: string
          format: uuid
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          nullable: true
        dismissed_by:
          type: string
          format: uuid
          nullable: true
        dismissal_reason:
          type: string
          nullable: true
        correlation_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    DeadLetterStats:
      type: object
      properties:
        pending:
          type: integer
        replayed:
          type: integer
        dismissed:
          type: integer
        total:
          type: integer

    Pagination:
      type: object
      properties:
        total:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        last_page:
          type: integer

    LedgerIntegritySnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scan_at:
          type: string
          format: date-time
        wallets_checked:
          type: integer
        discrepancy_count:
          type: integer
        affected_wallet_ids:
          type: array
          items:
            type: string
            format: uuid
        outcome:
          type: string
          enum: [clean, discrepancy_found]
        duration_ms:
          type: integer
        correlation_id:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

security:
  - BearerAuth: []

paths:
  /dead-letter:
    get:
      summary: List dead-letter items
      operationId: listDeadLetterItems
      tags: [Dead Letter]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, replayed, dismissed]
        - name: operation_type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of dead-letter items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeadLetterItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions

  /dead-letter/stats:
    get:
      summary: Dead-letter statistics
      operationId: getDeadLetterStats
      tags: [Dead Letter]
      responses:
        '200':
          description: Status counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeadLetterStats'

  /dead-letter/{id}:
    get:
      summary: Get single dead-letter item
      operationId: getDeadLetterItem
      tags: [Dead Letter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dead-letter item (includes retry_history)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeadLetterItem'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dead-letter/{id}/replay:
    post:
      summary: Replay a pending dead-letter item
      operationId: replayDeadLetterItem
      tags: [Dead Letter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Item replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeadLetterItem'
        '409':
          description: Item already replayed or dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dead-letter/{id}/dismiss:
    post:
      summary: Dismiss a pending dead-letter item
      operationId: dismissDeadLetterItem
      tags: [Dead Letter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        '200':
          description: Item dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeadLetterItem'
        '409':
          description: Item already replayed or dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ledger-integrity/snapshots:
    get:
      summary: List ledger integrity scan snapshots
      operationId: listLedgerIntegritySnapshots
      tags: [Ledger Integrity]
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated snapshots ordered by scan_at DESC
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/LedgerIntegritySnapshot'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
