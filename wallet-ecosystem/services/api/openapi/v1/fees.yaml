openapi: 3.1.0
info:
  title: E21 — Fees & Pricing API
  version: "1.0"
  description: |
    Admin-configurable fee rules and fee preview for all transaction types.
    Covers US-FEE-001 through US-FEE-009.

    ## Security
    All endpoints require a valid JWT bearer token (issued by the Identity service).
    Fee rule CRUD requires the `fees.rules.*` permission (Operations Admin role).
    Fee calculation requires the `fees.calculate` permission (all authenticated roles).

paths:
  /v1/fees/rules:
    get:
      operationId: listFeeRules
      summary: List fee rules
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - name: transaction_type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: subject_type
          in: query
          schema:
            $ref: '#/components/schemas/SubjectType'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, deactivated, superseded]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of fee rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeRule'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createFeeRule
      summary: Create a fee rule
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeeRuleRequest'
            examples:
              percentage_global:
                summary: Global 0.5% transfer rule
                value:
                  transaction_type: transfer
                  fee_type: percentage
                  rate: 0.5
                  currency: BWP
                  subject_type: global
                  valid_from: "2026-10-01T00:00:00Z"
                  min_fee_minor: 100
                  max_fee_minor: 5000
              fixed_agent:
                summary: Per-agent fixed cash-in rule
                value:
                  transaction_type: cash_in
                  fee_type: fixed
                  amount_minor: 50
                  currency: BWP
                  subject_type: agent
                  subject_id: "018f3c2a-0000-7000-8000-000000000001"
                  valid_from: "2026-10-01T00:00:00Z"
      responses:
        "201":
          description: Fee rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "409":
          description: Active rule conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FEE_RULE_CONFLICT
                  message: An active fee rule already exists for this transaction_type, currency, and subject scope.
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/fees/rules/{id}:
    get:
      operationId: getFeeRule
      summary: Get a fee rule by ID
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
      responses:
        "200":
          description: Fee rule found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    patch:
      operationId: updateFeeRule
      summary: Update a fee rule (set bounds, update valid_to)
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeeRuleRequest'
      responses:
        "200":
          description: Fee rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deactivateFeeRule
      summary: Deactivate (soft-delete) a fee rule
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
      responses:
        "204":
          description: Fee rule deactivated
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/fees/calculate:
    post:
      operationId: calculateFee
      summary: Calculate fee for a proposed transaction
      description: |
        Returns the fee that will be charged if the described transaction proceeds.
        This is a read-only, stateless operation — it does NOT create any records.
        The same inputs always produce the same output (deterministic).
        The returned fee_amount_minor will match the fee deducted during actual execution.
      tags: [fee-calculate]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateFeeRequest'
            examples:
              transfer_500:
                summary: BWP 500 transfer (0.5% rule → BWP 2.50)
                value:
                  transaction_type: transfer
                  amount_minor: 50000
                  currency: BWP
                  subject_type: customer
                  subject_id: "018f3c2a-0000-7000-8000-000000000001"
              bill_payment_fixed:
                summary: Bill payment (fixed BWP 1.50 rule)
                value:
                  transaction_type: bill_payment
                  amount_minor: 20000
                  currency: BWP
                  subject_type: global
      responses:
        "200":
          description: Fee calculation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeCalculationResult'
              examples:
                percentage_result:
                  summary: Percentage fee applied
                  value:
                    data:
                      fee_amount_minor: 250
                      fee_type: percentage
                      rule_id: "018f3c2a-0000-7000-8000-000000000099"
                      has_applicable_rule: true
                      min_fee_applied: false
                      max_fee_applied: false
                no_rule:
                  summary: No applicable rule (zero fee)
                  value:
                    data:
                      fee_amount_minor: 0
                      fee_type: null
                      rule_id: null
                      has_applicable_rule: false
                      min_fee_applied: false
                      max_fee_applied: false
        "422":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unsupported_type:
                  value:
                    error:
                      code: UNSUPPORTED_TRANSACTION_TYPE
                      message: "The transaction_type 'loan_repayment' is not supported."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FeeRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUID v4/v7; identical key replays the same response.

  schemas:
    TransactionType:
      type: string
      enum:
        - transfer
        - funding
        - withdrawal
        - bill_payment
        - qr_payment
        - cash_in
        - cash_out
        - settlement

    SubjectType:
      type: string
      enum:
        - global
        - customer
        - agent

    FeeType:
      type: string
      enum:
        - fixed
        - percentage

    FeeRuleStatus:
      type: string
      enum:
        - active
        - expired
        - deactivated
        - superseded

    FeeRule:
      type: object
      required:
        - id
        - transaction_type
        - fee_type
        - currency
        - subject_type
        - status
        - valid_from
        - created_at
      properties:
        id:
          type: string
          format: uuid
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        fee_type:
          $ref: '#/components/schemas/FeeType'
        rate:
          type: number
          format: decimal
          nullable: true
          description: Percentage rate (present when fee_type=percentage)
          example: 0.5
        amount_minor:
          type: integer
          nullable: true
          description: Fixed fee in minor units (present when fee_type=fixed)
          example: 150
        min_fee_minor:
          type: integer
          nullable: true
          description: Minimum fee floor in minor units (percentage rules only)
        max_fee_minor:
          type: integer
          nullable: true
          description: Maximum fee ceiling in minor units (percentage rules only)
        currency:
          type: string
          example: BWP
        subject_type:
          $ref: '#/components/schemas/SubjectType'
        subject_id:
          type: string
          format: uuid
          nullable: true
          description: Customer or agent UUID (null when subject_type=global)
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/FeeRuleStatus'
        pricing_version_id:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFeeRuleRequest:
      type: object
      required:
        - transaction_type
        - fee_type
        - currency
        - subject_type
        - valid_from
      properties:
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        fee_type:
          $ref: '#/components/schemas/FeeType'
        rate:
          type: number
          format: decimal
          description: Required when fee_type=percentage; must be > 0 and <= 100
          example: 0.5
        amount_minor:
          type: integer
          description: Required when fee_type=fixed; must be > 0
          example: 150
        min_fee_minor:
          type: integer
          description: Optional; applicable to percentage rules only; must be > 0 and <= max_fee_minor
        max_fee_minor:
          type: integer
          description: Optional; applicable to percentage rules only; must be > 0 and >= min_fee_minor
        currency:
          type: string
          default: BWP
          example: BWP
        subject_type:
          $ref: '#/components/schemas/SubjectType'
        subject_id:
          type: string
          format: uuid
          description: Required when subject_type=customer or subject_type=agent
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        pricing_version_id:
          type: string
          format: uuid

    UpdateFeeRuleRequest:
      type: object
      description: All fields are optional; only supplied fields are updated.
      properties:
        valid_to:
          type: string
          format: date-time
          description: Set to expire the rule at a future or past date-time
        min_fee_minor:
          type: integer
          description: Minimum fee floor (percentage rules only); must be <= max_fee_minor
        max_fee_minor:
          type: integer
          description: Maximum fee ceiling (percentage rules only); must be >= min_fee_minor

    CalculateFeeRequest:
      type: object
      required:
        - transaction_type
        - amount_minor
        - currency
        - subject_type
      properties:
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        amount_minor:
          type: integer
          minimum: 1
          description: Transaction amount in minor units (e.g., 50000 = BWP 500.00)
          example: 50000
        currency:
          type: string
          description: ISO 4217 currency code
          default: BWP
          example: BWP
        subject_type:
          $ref: '#/components/schemas/SubjectType'
          description: |
            Indicates whose fee rules to check.
            - `global`: resolve the global rule for this transaction type
            - `customer`: check for customer-specific override first, then global
            - `agent`: check for agent-specific override first, then global
        subject_id:
          type: string
          format: uuid
          nullable: true
          description: Required when subject_type=customer or subject_type=agent

    FeeCalculationResult:
      type: object
      required:
        - fee_amount_minor
        - has_applicable_rule
        - min_fee_applied
        - max_fee_applied
      properties:
        fee_amount_minor:
          type: integer
          description: Calculated fee in minor units; 0 if no applicable rule
          example: 250
        fee_type:
          type: string
          enum: [fixed, percentage]
          nullable: true
          description: Type of the applied rule; null if no applicable rule
        rule_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the fee rule used for calculation; null if no applicable rule
        has_applicable_rule:
          type: boolean
          description: True if an active rule was found for this context
        min_fee_applied:
          type: boolean
          description: True if the minimum fee floor was applied (percentage rules only)
        max_fee_applied:
          type: boolean
          description: True if the maximum fee ceiling was applied (percentage rules only)

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        pages:
          type: integer

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: JWT missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but missing required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
