openapi: 3.0.3
info:
  title: QA & Validation API
  description: E34 — QA test orchestration endpoints for the OleKard Wallet Ecosystem.
  version: "1.0.0"

tags:
  - name: QA
    description: QA test run management

paths:
  /v1/qa/{category}:
    post:
      tags: [QA]
      summary: Trigger a QA test run
      description: >
        Triggers an async QA run for the specified category. Requires `Idempotency-Key` header.
        Returns 202 for a new run, 200 for an idempotent duplicate, 409 if a run is already in progress.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum:
              - unit-test-authentication
              - integration-test-authentication
              - api-authorization-testing
              - wallet-balance-testing
              - ledger-balance-testing
              - transfer-testing
              - duplicate-transaction-testing
              - callback-testing
              - payment-failure-testing
              - reconciliation-testing
              - kyc-testing
              - agent-testing
              - security-testing
              - performance-testing
              - load-testing
              - disaster-recovery-testing
              - uat
              - regression-testing
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
            format: uuid
      security:
        - BearerAuth: []
      responses:
        "202":
          description: New run created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunResponse"
        "200":
          description: Idempotent duplicate — existing run returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Category already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: QA_CATEGORY_RUNNING
                  message: "A QA run for category 'unit_auth' is already in progress."
        "422":
          description: Missing Idempotency-Key header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: QA_IDEM_REQUIRED
                  message: "Idempotency-Key header is required."

  /v1/qa/runs:
    get:
      tags: [QA]
      summary: List QA runs
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Paginated list of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TestRun"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/qa/runs/{id}:
    get:
      tags: [QA]
      summary: Get QA run detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Run with nested results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TestRunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: QA_RUN_NOT_FOUND
                  message: "No QA run found with the given ID."

  /v1/qa/dashboard:
    get:
      tags: [QA]
      summary: QA dashboard aggregate
      description: Returns the latest run per category plus summary counts.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: QA_UNAUTHORIZED
              message: "Unauthenticated."
    Forbidden:
      description: Insufficient permission (qa.execute required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: QA_FORBIDDEN
              message: "This action is unauthorized."

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    RunCounts:
      type: object
      properties:
        passed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        total:
          type: integer

    TestRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        triggered_by:
          type: string
          format: uuid
        counts:
          $ref: "#/components/schemas/RunCounts"
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    TestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        test_case_code:
          type: string
        test_case_name:
          type: string
        scenario_type:
          type: string
          enum: [happy_path, validation, authorization, boundary, failure, idempotency, audit, regression]
        outcome:
          type: string
          enum: [passed, failed, skipped, error]
        duration_ms:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        evidence:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    TestRunDetail:
      allOf:
        - $ref: "#/components/schemas/TestRun"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/TestResult"

    TestRunResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TestRun"

    CategorySummary:
      type: object
      properties:
        category:
          type: string
        label:
          type: string
        latest_run_id:
          type: string
          format: uuid
          nullable: true
        latest_status:
          type: string
          enum: [pending, running, completed, failed]
          nullable: true
        passed:
          type: integer
          nullable: true
        failed:
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
        last_run_at:
          type: string
          format: date-time
          nullable: true

    DashboardSummary:
      type: object
      properties:
        total_categories:
          type: integer
        categories_with_run:
          type: integer

    Dashboard:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        total:
          type: integer
        per_page:
          type: integer
