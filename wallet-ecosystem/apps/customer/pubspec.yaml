name: wallet_customer
description: Wallet Ecosystem customer mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_system:
    path: ../../packages/design-system
  shared_payment:
    path: ../../packages/shared-payment
  firebase_core: ^5.0.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  dio: ^5.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^11.2.0
