  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  intl: ^0.20.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  bcrypt: ^1.1.3
  cached_network_image: ^4.0.4
  url_launcher: 6.3.2

dev_dependencies:
