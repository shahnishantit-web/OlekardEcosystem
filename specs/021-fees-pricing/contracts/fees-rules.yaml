openapi: 3.1.0
info:
  title: E21 — Fee Rules API
  version: "1.0"
  description: CRUD operations for fee rules (US-FEE-001, US-FEE-002, US-FEE-003, US-FEE-004, US-FEE-005, US-FEE-006, US-FEE-007)

paths:
  /v1/fees/rules:
    get:
      operationId: listFeeRules
      summary: List fee rules
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - name: transaction_type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: subject_type
          in: query
          schema:
            $ref: '#/components/schemas/SubjectType'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, deactivated, superseded]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of fee rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeRule'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createFeeRule
      summary: Create a fee rule
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeeRuleRequest'
      responses:
        "201":
          description: Fee rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "409":
          description: Active rule conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FEE_RULE_CONFLICT
                  message: An active fee rule already exists for this transaction_type, currency, and subject scope.
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/fees/rules/{id}:
    get:
      operationId: getFeeRule
      summary: Get a fee rule by ID
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
      responses:
        "200":
          description: Fee rule found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'

    patch:
      operationId: updateFeeRule
      summary: Update a fee rule (deactivate, set bounds, update valid_to)
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeeRuleRequest'
      responses:
        "200":
          description: Fee rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeRule'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deactivateFeeRule
      summary: Deactivate (soft-delete) a fee rule
      tags: [fee-rules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeeRuleId'
      responses:
        "204":
          description: Fee rule deactivated
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FeeRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUID v4/v7; identical key replays the same response.

  schemas:
    TransactionType:
      type: string
      enum:
        - transfer
        - funding
        - withdrawal
        - bill_payment
        - qr_payment
        - cash_in
        - cash_out
        - settlement

    SubjectType:
      type: string
      enum:
        - global
        - customer
        - agent

    FeeType:
      type: string
      enum:
        - fixed
        - percentage

    FeeRuleStatus:
      type: string
      enum:
        - active
        - expired
        - deactivated
        - superseded

    FeeRule:
      type: object
      required:
        - id
        - transaction_type
        - fee_type
        - currency
        - subject_type
        - status
        - valid_from
        - created_at
      properties:
        id:
          type: string
          format: uuid
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        fee_type:
          $ref: '#/components/schemas/FeeType'
        rate:
          type: number
          format: decimal
          description: Percentage rate (present when fee_type=percentage)
          example: 0.5
        amount_minor:
          type: integer
          description: Fixed fee in minor units (present when fee_type=fixed)
          example: 150
        min_fee_minor:
          type: integer
          nullable: true
          description: Minimum fee floor in minor units (percentage rules only)
        max_fee_minor:
          type: integer
          nullable: true
          description: Maximum fee ceiling in minor units (percentage rules only)
        currency:
          type: string
          example: BWP
        subject_type:
          $ref: '#/components/schemas/SubjectType'
        subject_id:
          type: string
          format: uuid
          nullable: true
          description: Customer or agent UUID (null when subject_type=global)
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/FeeRuleStatus'
        pricing_version_id:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFeeRuleRequest:
      type: object
      required:
        - transaction_type
        - fee_type
        - currency
        - subject_type
        - valid_from
      properties:
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        fee_type:
          $ref: '#/components/schemas/FeeType'
        rate:
          type: number
          format: decimal
          description: Required when fee_type=percentage; must be > 0 and <= 100
          example: 0.5
        amount_minor:
          type: integer
          description: Required when fee_type=fixed; must be > 0
          example: 150
        min_fee_minor:
          type: integer
          description: Optional; applicable to percentage rules only
        max_fee_minor:
          type: integer
          description: Optional; applicable to percentage rules only; must be >= min_fee_minor
        currency:
          type: string
          default: BWP
          example: BWP
        subject_type:
          $ref: '#/components/schemas/SubjectType'
        subject_id:
          type: string
          format: uuid
          description: Required when subject_type=customer or subject_type=agent
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        pricing_version_id:
          type: string
          format: uuid

    UpdateFeeRuleRequest:
      type: object
      description: All fields are optional; only supplied fields are updated.
      properties:
        valid_to:
          type: string
          format: date-time
          description: Set to past timestamp to expire the rule
        min_fee_minor:
          type: integer
        max_fee_minor:
          type: integer

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        pages:
          type: integer

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: JWT missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but missing required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
