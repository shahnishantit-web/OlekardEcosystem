openapi: 3.1.0
info:
  title: Multi-Currency Wallet API
  version: 1.0.0
  description: |
    E29 — Multi-Currency Wallet API.

    Customers can create and manage currency wallets, view balances, perform same-currency
    transfers, request FX quotes, and confirm conversions. Admin operators manage supported
    currencies and exchange rates (via maker-checker approval).

    All state-changing endpoints require an `Idempotency-Key` header.
    FX conversion is a two-phase flow: POST /fx-quotes (quote) then POST /fx-quotes/{id}/confirm.

servers:
  - url: /v1
    description: API v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      schema: { type: string }

  schemas:
    ApiEnvelope:
      type: object
      required: [success, data, error, correlation_id]
      properties:
        success: { type: boolean }
        data: { nullable: true }
        error:
          nullable: true
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
        correlation_id: { type: string }
        meta: { nullable: true, type: object }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Currency:
      type: object
      properties:
        code: { type: string, example: "USD" }
        name: { type: string, example: "US Dollar" }
        symbol: { type: string, example: "$" }
        decimal_places: { type: integer, example: 2 }
        is_active: { type: boolean }

    CurrencyWallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency_code: { type: string, example: "USD" }
        currency_name: { type: string }
        currency_symbol: { type: string }
        balance: { type: string, format: decimal, example: "1500.00" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    FxQuote:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_currency_code: { type: string }
        to_currency_code: { type: string }
        from_amount: { type: string, format: decimal }
        to_amount: { type: string, format: decimal }
        fee_amount: { type: string, format: decimal }
        rate: { type: string, format: decimal }
        status: { type: string, enum: [quoted, confirmed, expired, cancelled] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    FxTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        quote_id: { type: string, format: uuid }
        from_currency_code: { type: string }
        to_currency_code: { type: string }
        from_amount: { type: string, format: decimal }
        to_amount: { type: string, format: decimal }
        fee_amount: { type: string, format: decimal }
        rate: { type: string, format: decimal }
        status: { type: string, enum: [completed, failed] }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    FxRate:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_currency_code: { type: string }
        to_currency_code: { type: string }
        rate: { type: string, format: decimal }
        spread: { type: string, format: decimal }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

paths:

  # ── Currencies ──────────────────────────────────────────────────────────────

  /multi-currency/currencies:
    get:
      summary: List active currencies (US-MCW-002)
      operationId: listCurrencies
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List of active currencies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Currency' } }
        '401': { description: Unauthenticated }

  # ── Currency Wallets ─────────────────────────────────────────────────────────

  /multi-currency/wallets:
    get:
      summary: List all currency wallets with balances (US-MCW-003)
      operationId: listCurrencyWallets
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Customer's currency wallets with current balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CurrencyWallet' } }
        '401': { description: Unauthenticated }

    post:
      summary: Create a currency wallet (US-MCW-001)
      operationId: createCurrencyWallet
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency_code]
              properties:
                currency_code:
                  type: string
                  maxLength: 3
                  example: "USD"
      responses:
        '201':
          description: Currency wallet created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrencyWallet' }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '409': { description: Wallet already exists for this currency }
        '422': { description: Currency not supported or inactive }

  /multi-currency/wallets/{id}:
    get:
      summary: Get currency wallet detail (US-MCW-003)
      operationId: getCurrencyWallet
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Currency wallet detail with balance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrencyWallet' }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Not found }

  /multi-currency/wallets/{id}/transfers:
    post:
      summary: Transfer between own same-currency wallets (US-MCW-004)
      operationId: sameCurrencyTransfer
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Source currency wallet ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_wallet_id, amount]
              properties:
                to_wallet_id:
                  type: string
                  format: uuid
                  description: Target wallet (must be same currency, same customer)
                amount:
                  type: string
                  format: decimal
                  example: "500.00"
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          transaction_id: { type: string, format: uuid }
                          status: { type: string, example: "completed" }
        '400': { description: Validation error or insufficient balance }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden — wallet not owned by customer, or currency mismatch }
        '422': { description: Transfer to different currency — use FX conversion instead }

  # ── FX Fee Preview ──────────────────────────────────────────────────────────

  /multi-currency/fx-fee:
    get:
      summary: Calculate FX fee preview (US-MCW-006)
      operationId: calculateFxFee
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from_currency
          in: query
          required: true
          schema: { type: string }
        - name: to_currency
          in: query
          required: true
          schema: { type: string }
        - name: amount
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Fee preview (informational only, not a binding quote)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          from_amount: { type: string, format: decimal }
                          fee_amount: { type: string, format: decimal }
                          to_amount_estimate: { type: string, format: decimal }
                          rate_estimate: { type: string, format: decimal }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '422': { description: No active rate for this currency pair }

  # ── FX Quotes & Conversion ───────────────────────────────────────────────────

  /multi-currency/fx-quotes:
    post:
      summary: Request a locked FX quote — Phase 1 of conversion (US-MCW-007)
      operationId: createFxQuote
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency_code, to_currency_code, from_amount]
              properties:
                from_currency_code: { type: string }
                to_currency_code: { type: string }
                from_amount: { type: string, format: decimal }
      responses:
        '201':
          description: Quote created — rate locked for 60 seconds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FxQuote' }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '422': { description: No active rate for this currency pair, or insufficient balance }

  /multi-currency/fx-quotes/{id}/confirm:
    post:
      summary: Confirm FX conversion — Phase 2, synchronous settlement (US-MCW-007, US-MCW-008)
      operationId: confirmFxQuote
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Conversion completed — FX ledger entries posted, FxTransaction returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FxTransaction' }
        '401': { description: Unauthenticated }
        '403': { description: Quote does not belong to this customer }
        '404': { description: Quote not found }
        '409': { description: Quote already confirmed (idempotent — returns existing FxTransaction) }
        '422': { description: Quote expired or insufficient balance at confirm time }

  # ── FX Transaction History ───────────────────────────────────────────────────

  /multi-currency/fx-transactions:
    get:
      summary: List FX transaction history (US-MCW-009)
      operationId: listFxTransactions
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from_currency
          in: query
          schema: { type: string }
        - name: to_currency
          in: query
          schema: { type: string }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated FX transaction history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data: { type: array, items: { $ref: '#/components/schemas/FxTransaction' } }
                          meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { description: Unauthenticated }

  /multi-currency/fx-transactions/{id}:
    get:
      summary: Get single FX transaction (US-MCW-009)
      operationId: getFxTransaction
      tags: [MultiCurrency]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: FX transaction detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FxTransaction' }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Not found }

  # ── Admin: Currency Management ───────────────────────────────────────────────

  /admin/multi-currency/currencies:
    get:
      summary: List all currencies including inactive (admin)
      operationId: adminListCurrencies
      tags: [MultiCurrencyAdmin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: All currencies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Currency' } }

    post:
      summary: Add or activate a currency (US-MCW-002)
      operationId: adminCreateCurrency
      tags: [MultiCurrencyAdmin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol, decimal_places]
              properties:
                code: { type: string, maxLength: 3 }
                name: { type: string }
                symbol: { type: string }
                decimal_places: { type: integer }
                is_active: { type: boolean, default: true }
      responses:
        '201': { description: Currency created }
        '409': { description: Currency code already exists }

  /admin/multi-currency/currencies/{code}:
    patch:
      summary: Activate or deactivate a currency
      operationId: adminUpdateCurrency
      tags: [MultiCurrencyAdmin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean }
      responses:
        '200': { description: Updated }
        '404': { description: Not found }

  # ── Admin: FX Rate Management ────────────────────────────────────────────────

  /admin/multi-currency/fx-rates:
    get:
      summary: List current FX rates (US-MCW-005)
      operationId: adminListFxRates
      tags: [MultiCurrencyAdmin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: All active FX rates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FxRate' } }

    post:
      summary: Submit FX rate configuration change (US-MCW-005)
      operationId: adminSubmitFxRate
      tags: [MultiCurrencyAdmin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency_code, to_currency_code, rate, spread, effective_from]
              properties:
                from_currency_code: { type: string }
                to_currency_code: { type: string }
                rate: { type: string, format: decimal }
                spread: { type: string, format: decimal, description: Fee as decimal (0.015 = 1.5%) }
                effective_from: { type: string, format: date-time }
      responses:
        '201':
          description: Rate change submitted — pending maker-checker approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FxRate' }
        '400': { description: Validation error }
        '403': { description: Missing multi_currency.configure_rate permission }
        '409': { description: Pending change already exists for this pair }
