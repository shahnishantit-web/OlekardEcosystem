openapi: "3.1.0"
info:
  title: Risk Rules Configuration API
  description: Configure per-transaction, daily, monthly, customer, agent and wallet limits (US-RISK-010 through US-RISK-015)
  version: "1.0.0"

tags:
  - name: rules
    description: Risk rule configuration

paths:
  /v1/risk/configure-per-transaction-limit:
    post:
      tags: [rules]
      operationId: configurePerTransactionLimit
      summary: Set or update the per-transaction amount limit (US-RISK-010)
      description: |
        Creates or replaces the per-transaction limit rule for a given scope
        (global, customer, agent, or wallet). Idempotent by (rule_name, subject_id).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountLimitRuleRequest'
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/configure-daily-limit:
    post:
      tags: [rules]
      operationId: configureDailyLimit
      summary: Set or update the rolling 24-hour cumulative amount limit (US-RISK-011)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VelocityAmountRuleRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/configure-monthly-limit:
    post:
      tags: [rules]
      operationId: configureMonthlyLimit
      summary: Set or update the rolling 30-day cumulative amount limit (US-RISK-012)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VelocityAmountRuleRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/configure-customer-limits:
    post:
      tags: [rules]
      operationId: configureCustomerLimits
      summary: Set or update limits scoped to a specific customer (US-RISK-013)
      description: Overrides global defaults for a single customer. All limit types may be included.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectLimitsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectLimitsResponse'
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/configure-agent-limits:
    post:
      tags: [rules]
      operationId: configureAgentLimits
      summary: Set or update limits scoped to a specific agent (US-RISK-014)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectLimitsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectLimitsResponse'
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/configure-wallet-limits:
    post:
      tags: [rules]
      operationId: configureWalletLimits
      summary: Set or update limits scoped to a specific wallet (US-RISK-015)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectLimitsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectLimitsResponse'
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /v1/risk/rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List all active risk rules
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: rule_type
          schema:
            type: string
        - in: query
          name: applies_to
          schema:
            type: string
        - in: query
          name: subject_id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskRuleResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but lacks required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AmountLimitRuleRequest:
      type: object
      required: [applies_to, threshold_amount, action]
      properties:
        applies_to:
          type: string
          enum: [global, customer, agent, wallet]
        subject_id:
          type: string
          format: uuid
          nullable: true
          description: Required when applies_to is not global
        threshold_amount:
          type: string
          description: Maximum allowed amount per transaction
          example: "5000.00"
        action:
          type: string
          enum: [block, review]
        effective_from:
          type: string
          format: date-time
          nullable: true
        effective_until:
          type: string
          format: date-time
          nullable: true

    VelocityAmountRuleRequest:
      type: object
      required: [applies_to, threshold_amount, window_seconds, action]
      properties:
        applies_to:
          type: string
          enum: [global, customer, agent, wallet]
        subject_id:
          type: string
          format: uuid
          nullable: true
        threshold_amount:
          type: string
          example: "20000.00"
        window_seconds:
          type: integer
          description: Rolling window; 86400 = daily, 2592000 = 30-day monthly
        action:
          type: string
          enum: [block, review]

    SubjectLimitsRequest:
      type: object
      required: [subject_id]
      properties:
        subject_id:
          type: string
          format: uuid
        per_transaction_limit:
          type: string
          nullable: true
          description: Override per-transaction limit; null = use global
        daily_limit:
          type: string
          nullable: true
        monthly_limit:
          type: string
          nullable: true
        per_transaction_action:
          type: string
          enum: [block, review]
          default: block
        daily_action:
          type: string
          enum: [block, review]
          default: block
        monthly_action:
          type: string
          enum: [block, review]
          default: review

    RiskRuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rule_type:
          type: string
        applies_to:
          type: string
        subject_id:
          type: string
          format: uuid
          nullable: true
        threshold_amount:
          type: string
          nullable: true
        threshold_count:
          type: integer
          nullable: true
        window_seconds:
          type: integer
          nullable: true
        action:
          type: string
        is_active:
          type: boolean
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubjectLimitsResponse:
      type: object
      properties:
        subject_id:
          type: string
          format: uuid
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RiskRuleResponse'

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
