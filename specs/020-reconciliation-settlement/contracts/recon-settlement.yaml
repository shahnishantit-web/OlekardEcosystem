openapi: 3.1.0
info:
  title: Settlement API
  version: 1.0.0
  description: |
    E20 Reconciliation & Settlement — Settlement workflow endpoints.
    Covers US-RECON-012 (calculate), US-RECON-013 (generate batch),
    US-RECON-014 (approve, maker-checker), US-RECON-015 (execute), US-RECON-016 (record ledger).

servers:
  - url: /v1/reconciliation

security:
  - bearerAuth: []

paths:
  /settlements:
    get:
      operationId: listSettlements
      summary: List settlement batches
      tags: [settlements]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, approved, executing, executed, rejected, failed]
        - name: settlement_type
          in: query
          schema:
            type: string
            enum: [provider_settlement, bank_settlement]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated settlement list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createSettlementBatch
      summary: Calculate and generate a settlement batch (US-RECON-012 + US-RECON-013)
      tags: [settlements]
      description: |
        Calculates the net settlement amount for the specified period and creates a
        SettlementBatch record with status=draft. Requires Idempotency-Key header.
        Idempotent: same key returns existing batch.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_type, period_start, period_end, currency_code]
              properties:
                settlement_type:
                  type: string
                  enum: [provider_settlement, bank_settlement]
                period_start:
                  type: string
                  format: date
                period_end:
                  type: string
                  format: date
                currency_code:
                  type: string
                  enum: [BWP]
                provider_code:
                  type: string
                  maxLength: 50
                  description: Optional — config-driven provider identifier
                reconciliation_item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: |
                    Optional explicit list of matched reconciliation item IDs to include.
                    If omitted, all matched items for the period are included automatically.
      responses:
        '201':
          description: Settlement batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '200':
          description: Idempotent — returning existing batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '400':
          description: Missing Idempotency-Key header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settlements/{id}:
    get:
      operationId: getSettlement
      summary: Get settlement batch detail
      tags: [settlements]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Settlement detail with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settlements/{id}/approve:
    post:
      operationId: approveSettlement
      summary: Approve a settlement batch (US-RECON-014, maker-checker)
      tags: [settlements]
      description: |
        Approves a settlement batch for execution. Implements maker-checker pattern:
        - Checker must be a different user from the maker (422 if same)
        - Batch must be in pending_approval status (409 otherwise)
        - Requires reconciliation.approve_settlement permission
        Wrapped in a database transaction with lockForUpdate.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: Settlement approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '400':
          description: Missing Idempotency-Key header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Settlement not in pending_approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Maker-checker violation (same user) or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settlements/{id}/reject:
    post:
      operationId: rejectSettlement
      summary: Reject a settlement batch
      tags: [settlements]
      description: |
        Rejects a settlement batch (terminal state). Same maker-checker rules as approve.
        Requires reconciliation.approve_settlement permission.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: Settlement rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '409':
          description: Settlement not in pending_approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Maker-checker violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settlements/{id}/submit:
    post:
      operationId: submitSettlementForApproval
      summary: Submit a draft settlement for maker-checker approval
      tags: [settlements]
      description: |
        Transitions a draft settlement batch to pending_approval.
        Only the maker (creator) can submit.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Settlement submitted for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '409':
          description: Settlement not in draft status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settlements/{id}/execute:
    post:
      operationId: executeSettlement
      summary: Execute an approved settlement (US-RECON-015 + US-RECON-016)
      tags: [settlements]
      description: |
        Dispatches the ExecuteSettlementJob which calls the SettlementAdapterInterface::execute()
        and then posts a double-entry ledger journal via E07 LedgerModuleContract::postEntry()
        (entry_type='settlement'). Returns 409 if not in approved status.
        Requires reconciliation.execute_settlement permission and Idempotency-Key header.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '202':
          description: Execution job dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '400':
          description: Missing Idempotency-Key header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Settlement not in approved status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SettlementSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        settlement_type:
          type: string
          enum: [provider_settlement, bank_settlement]
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        currency_code:
          type: string
        gross_amount:
          type: string
          description: Decimal string
        fee_amount:
          type: string
          description: Decimal string
        net_amount:
          type: string
          description: Decimal string
        status:
          type: string
          enum: [draft, pending_approval, approved, executing, executed, rejected, failed]
        maker_id:
          type: string
          format: uuid
        checker_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        executed_at:
          type: string
          format: date-time
          nullable: true
        ledger_transaction_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    SettlementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SettlementSummary'

    SettlementDetailResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/SettlementSummary'
            - type: object
              properties:
                item_count:
                  type: integer
                external_reference:
                  type: string
                  nullable: true
                rejection_reason:
                  type: string
                  nullable: true

    SettlementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SettlementSummary'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
