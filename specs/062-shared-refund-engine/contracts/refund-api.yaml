openapi: "3.1.0"
info:
  title: "Payment Refund API — P15"
  version: "1.0.0"
  description: |
    New and extended endpoints for the shared refund engine (P15).
    All endpoints require Bearer JWT. Organisation scope is derived server-side.

paths:

  # ─── Existing (extended) ───────────────────────────────────────────────────

  /v1/payment/intents/{intentId}/refunds:
    post:
      summary: Request a refund against a succeeded payment intent
      operationId: requestRefund
      tags: [Refund]
      security:
        - BearerAuth: []
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor:
                  type: integer
                  minimum: 1
                  description: Refund amount in minor currency units (integer only)
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Refund requested — may be pending approval or processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRefundResource"
        "422":
          description: Validation error — intent not refundable, refund limit exceeded, or domain ineligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing payment.refunds.request permission

  # ─── New: Customer mobile read ──────────────────────────────────────────────

  /v1/customer/payments/{intentId}/refunds:
    get:
      summary: List refunds for a payment intent (consumer mobile)
      operationId: listCustomerRefunds
      tags: [Refund, Customer]
      security:
        - BearerAuth: []
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of refunds for the intent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerRefundListItem"
                  meta:
                    $ref: "#/components/schemas/RefundSummaryMeta"
        "403":
          description: Intent not owned by the requesting consumer
        "404":
          description: Intent not found

  # ─── New: Admin management ───────────────────────────────────────────────────

  /v1/admin/payment/refunds:
    get:
      summary: List all refunds with filtering (admin)
      operationId: adminListRefunds
      tags: [Refund, Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, pending_approval, processing, submitted, pending, unknown, confirmed, definitive_failure, failed, cancelled, rejected]
        - name: provider_code
          in: query
          schema: { type: string }
        - name: organisation_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated refund list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRefundListItem"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403":
          description: Missing payment.refunds.view permission

  /v1/admin/payment/refunds/{id}:
    get:
      summary: Get refund detail (admin)
      operationId: adminGetRefund
      tags: [Refund, Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Refund detail with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefundDetail"
        "403":
          description: Missing payment.refunds.view permission
        "404":
          description: Refund not found

  /v1/admin/payment/refunds/{id}/query-status:
    post:
      summary: Dispatch QueryRefundStatusJob for a submitted/pending/unknown refund
      operationId: adminQueryRefundStatus
      tags: [Refund, Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Job dispatched — current state unchanged
        "422":
          description: Refund is in a terminal state; query not applicable
        "403":
          description: Missing payment.refunds.manage permission

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaymentRefundResource:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        payment_attempt_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        currency_code: { type: string }
        status: { type: string }
        approval_required: { type: boolean }
        requested_by: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        refund_accounting_status: { type: string, nullable: true }

    CustomerRefundListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        status_label:
          type: string
          description: Human-readable label safe to display to consumer
          example: "Being processed"
        amount_minor: { type: integer }
        currency_code: { type: string }
        requested_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        funds_returned:
          type: boolean
          description: true only when status = confirmed

    RefundSummaryMeta:
      type: object
      properties:
        total_confirmed_minor: { type: integer }
        remaining_refundable_minor: { type: integer }
        has_pending_refunds: { type: boolean }

    AdminRefundListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        provider_code: { type: string }
        amount_minor: { type: integer }
        currency_code: { type: string }
        status: { type: string }
        refund_accounting_status: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        reserved_since: { type: string, format: date-time, nullable: true }

    AdminRefundDetail:
      allOf:
        - $ref: "#/components/schemas/AdminRefundListItem"
        - type: object
          properties:
            approval_required: { type: boolean }
            approved_by_actor_id: { type: string, format: uuid, nullable: true }
            rejected_by_actor_id: { type: string, format: uuid, nullable: true }
            rejection_reason: { type: string, nullable: true }
            provider_submitted_ref: { type: string, nullable: true }
            provider_refund_reference: { type: string, nullable: true }
            refund_ledger_journal_id: { type: string, format: uuid, nullable: true }
            reconciliation_exception_id: { type: string, format: uuid, nullable: true }
            query_attempts: { type: integer }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        details: { type: object }
