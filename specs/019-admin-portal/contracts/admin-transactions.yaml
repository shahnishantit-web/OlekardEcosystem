openapi: 3.0.3
info:
  title: Admin Portal — Transaction Management API
  description: |
    E19 Admin Portal transaction management endpoints.
    US-ADMIN-022 through US-ADMIN-027.
  version: 1.0.0

servers:
  - url: /v1/admin

security:
  - bearerAuth: []

paths:
  /transactions:
    get:
      operationId: searchTransactions
      summary: Search transactions (US-ADMIN-022)
      description: |
        Search and filter transactions across all types (funding, transfer, withdrawal, bill payment, QR payment).
        Supports date range, status, type, amount range, and user/wallet filters.
      tags: [Transaction Management]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search by transaction ID, reference, or customer name/phone
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, failed, reversed, refunded, all]
            default: all
        - in: query
          name: type
          schema:
            type: string
            enum: [funding, transfer, withdrawal, bill_payment, qr_payment, all]
            default: all
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
        - in: query
          name: wallet_id
          schema:
            type: string
            format: uuid
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /transactions/{id}:
    get:
      operationId: getTransaction
      summary: View transaction detail (US-ADMIN-023)
      description: Returns full transaction detail including ledger entries and audit events.
      tags: [Transaction Management]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Full transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/{id}/investigate:
    get:
      operationId: investigateFailedTransaction
      summary: Investigate failed transaction (US-ADMIN-024)
      description: |
        Returns enriched diagnostics for a failed transaction, including:
        error codes, retry history, related ledger entries, and provider response logs.
      tags: [Transaction Management]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction investigation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transaction is not in a failed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{id}/reverse:
    post:
      operationId: reverseTransaction
      summary: Reverse transaction (US-ADMIN-025)
      description: |
        Posts compensating ledger entries via E07 LedgerService to fully reverse the transaction.
        Sets original transaction status to `reversed`.
        Requires `admin.write` + `admin.reverse_transaction` permission.
        Action logged in AdminAction and in the ledger (entry_type = admin_reversal).
        Only applicable to completed internal wallet transactions.
        **Idempotent**: replaying the same `Idempotency-Key` returns the original response without re-posting.
      tags: [Transaction Management]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 128
          description: Client-supplied unique key; replayed requests with the same key return the original response without double-posting compensating entries (constitution P8)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionActionRequest'
      responses:
        '200':
          description: Transaction reversed; compensating entries posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Idempotency-Key header is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction already reversed or refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transaction type does not support reversal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{id}/refund:
    post:
      operationId: refundTransaction
      summary: Refund transaction (US-ADMIN-026)
      description: |
        Posts a new credit entry to the originating customer's wallet via E07 LedgerService
        (entry_type = admin_refund). Does NOT reverse original ledger entries.
        Use when the original funding source cannot be unwound.
        Requires `admin.write` + `admin.refund_transaction` permission.
        Action logged in AdminAction.
        **Idempotent**: replaying the same `Idempotency-Key` returns the original response without re-crediting.
      tags: [Transaction Management]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 128
          description: Client-supplied unique key; replayed requests with the same key return the original response without double-posting the refund credit (constitution P8)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionActionRequest'
      responses:
        '200':
          description: Refund credit posted to customer wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Idempotency-Key header is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction already reversed or refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transaction type or status does not support refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/export:
    post:
      operationId: exportTransactions
      summary: Export transactions (US-ADMIN-027)
      description: |
        Exports filtered transactions as CSV.
        - ≤ 10,000 rows: synchronous CSV response (Content-Disposition: attachment).
        - > 10,000 rows: async export job dispatched; response contains a job_id and
          polling URL. The download URL is provided when the job completes (valid 24h).
        Requires `admin.read` + `admin.export_transactions` permission.
        Export action is logged in AdminAction.
      tags: [Transaction Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Synchronous CSV export (≤ 10,000 rows)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="transactions-2026-09-26.csv"
          content:
            text/csv:
              schema:
                type: string
        '202':
          description: Async export job accepted (> 10,000 rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /transactions/exports/{jobId}:
    get:
      operationId: getExportStatus
      summary: Poll export job status
      description: Returns status of an async export job. Includes download_url when ready.
      tags: [Transaction Management]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Export job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TransactionId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Transaction UUID

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

    TransactionActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: Mandatory justification for this admin action

    TransactionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        type:
          type: string
          enum: [funding, transfer, withdrawal, bill_payment, qr_payment]
        status:
          type: string
          enum: [pending, completed, failed, reversed, refunded]
        amount:
          type: string
        currency:
          type: string
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        wallet_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          properties:
            description:
              type: string
            fee:
              type: string
            provider_reference:
              type: string
              nullable: true
            idempotency_key:
              type: string
            ledger_entries:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  entry_type:
                    type: string
                  direction:
                    type: string
                  amount:
                    type: string
            admin_actions:
              type: array
              items:
                type: object
                properties:
                  action_type:
                    type: string
                  actor_id:
                    type: string
                    format: uuid
                  performed_at:
                    type: string
                    format: date-time
                  reason:
                    type: string

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TransactionDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TransactionDetail'

    TransactionActionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            action_id:
              type: string
              format: uuid
            action_type:
              type: string
            transaction_id:
              type: string
              format: uuid
            ledger_transaction_id:
              type: string
              format: uuid
              nullable: true
            performed_at:
              type: string
              format: date-time
            message:
              type: string

    InvestigationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            transaction:
              $ref: '#/components/schemas/TransactionDetail'
            failure_reason:
              type: string
            failure_code:
              type: string
            retry_count:
              type: integer
            provider_response:
              type: object
              nullable: true
            suggested_actions:
              type: array
              items:
                type: string

    ExportRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, completed, failed, reversed, refunded, all]
          default: all
        type:
          type: string
          enum: [funding, transfer, withdrawal, bill_payment, qr_payment, all]
          default: all
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        customer_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid

    ExportJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, processing, completed, failed]
            estimated_rows:
              type: integer
            poll_url:
              type: string
            queued_at:
              type: string
              format: date-time

    ExportJobStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, processing, completed, failed]
            row_count:
              type: integer
              nullable: true
            download_url:
              type: string
              nullable: true
              description: Signed URL valid for 24h (only when status=completed)
            expires_at:
              type: string
              format: date-time
              nullable: true
            error:
              type: string
              nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
