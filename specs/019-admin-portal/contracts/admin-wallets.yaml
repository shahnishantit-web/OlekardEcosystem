openapi: 3.0.3
info:
  title: Admin Portal — Wallet Management API
  description: |
    E19 Admin Portal wallet management endpoints.
    US-ADMIN-015 through US-ADMIN-021.
  version: 1.0.0

servers:
  - url: /v1/admin

security:
  - bearerAuth: []

paths:
  /wallets:
    get:
      operationId: searchWallets
      summary: Search wallets (US-ADMIN-015)
      description: Search wallets by owner name, phone, email, or wallet ID.
      tags: [Wallet Management]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search by owner name, phone, email, or wallet UUID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, frozen, all]
            default: all
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated wallet list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /wallets/{id}:
    get:
      operationId: getWalletBalance
      summary: View wallet balance and status (US-ADMIN-016)
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet detail with balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /wallets/{id}/freeze:
    post:
      operationId: freezeWallet
      summary: Freeze wallet (US-ADMIN-017)
      description: |
        Places an account hold on the wallet via E18 AccountHoldService.
        Requires `admin.write` + `admin.freeze_wallet` permissions.
        Requires `checker_id` (maker-checker — cannot be same as authenticated admin).
        Action logged in AdminAction.
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeWalletRequest'
      responses:
        '201':
          description: Wallet frozen; account hold placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wallet is already frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error (e.g. checker_id == maker_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallets/{id}/unfreeze:
    post:
      operationId: unfreezeWallet
      summary: Unfreeze wallet (US-ADMIN-018)
      description: |
        Lifts the active account hold on the wallet via E18 AccountHoldService.
        Requires `admin.write` + `admin.freeze_wallet` permission. Action logged in AdminAction.
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletActionRequest'
      responses:
        '200':
          description: Wallet unfrozen; account hold lifted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wallet is not currently frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallets/{id}/ledger:
    get:
      operationId: getWalletLedger
      summary: View wallet ledger entries (US-ADMIN-019)
      description: Returns paginated ledger entries for the wallet from E07 LedgerService.
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: entry_type
          schema:
            type: string
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /wallets/{id}/adjustments:
    post:
      operationId: createWalletAdjustment
      summary: Create controlled wallet adjustment (US-ADMIN-020)
      description: |
        Maker creates a pending wallet adjustment. The adjustment will not be posted
        until a different admin (checker) approves it via POST /adjustments/{id}/approve.
        Requires `admin.write` permission. Idempotency-Key header required.
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdjustmentRequest'
      responses:
        '201':
          description: Adjustment created; pending checker approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'

  /adjustments/{id}/approve:
    post:
      operationId: approveWalletAdjustment
      summary: Approve wallet adjustment (US-ADMIN-021)
      description: |
        Checker approves a pending wallet adjustment. Must be a different admin from the maker.
        On approval, the system immediately posts the double-entry journal via E07 LedgerService.
        Requires `admin.write` + `admin.approve_adjustment` permission.
        **Idempotent**: the adjustment UUID in the path is the natural idempotency key. A second
        approve request on the same adjustment (regardless of caller) returns HTTP 409 without
        double-posting — enforced via `SELECT … FOR UPDATE` inside a DB transaction (constitution P8).
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/AdjustmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletActionRequest'
      responses:
        '200':
          description: Adjustment approved and posted to ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Adjustment already approved, rejected, or posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Checker is the same as maker (maker-checker violation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /adjustments/{id}/reject:
    post:
      operationId: rejectWalletAdjustment
      summary: Reject wallet adjustment
      description: |
        Checker rejects a pending wallet adjustment. No ledger entry is posted.
        Requires `admin.write` + `admin.approve_adjustment` permission.
      tags: [Wallet Management]
      parameters:
        - $ref: '#/components/parameters/AdjustmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletActionRequest'
      responses:
        '200':
          description: Adjustment rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Adjustment not in pending_approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WalletId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Wallet UUID
    AdjustmentId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: AdminWalletAdjustment UUID

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    WalletActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000

    FreezeWalletRequest:
      type: object
      required: [reason, checker_id, hold_type]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
        checker_id:
          type: string
          format: uuid
          description: UUID of the second admin approving this freeze (maker ≠ checker)
        hold_type:
          type: string
          enum: [risk_freeze, compliance_hold, aml_investigation]

    CreateAdjustmentRequest:
      type: object
      required: [idempotency_key, adjustment_type, amount, currency, reason]
      properties:
        idempotency_key:
          type: string
          maxLength: 128
        adjustment_type:
          type: string
          enum: [credit, debit]
        amount:
          type: string
          description: Positive decimal string (BCMATH precision)
          example: "100.00"
        currency:
          type: string
          enum: [BWP]
        reason:
          type: string
          minLength: 10
          maxLength: 2000

    WalletSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        balance:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [active, frozen, closed]
        created_at:
          type: string
          format: date-time

    WalletDetail:
      allOf:
        - $ref: '#/components/schemas/WalletSummary'
        - type: object
          properties:
            available_balance:
              type: string
            pending_balance:
              type: string
            account_hold:
              type: object
              nullable: true
              properties:
                hold_id:
                  type: string
                  format: uuid
                hold_type:
                  type: string
                placed_by:
                  type: string
                placed_at:
                  type: string
                  format: date-time

    WalletListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    WalletDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WalletDetail'

    WalletActionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            action_id:
              type: string
              format: uuid
            action_type:
              type: string
            wallet_id:
              type: string
              format: uuid
            performed_at:
              type: string
              format: date-time
            message:
              type: string

    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entry_type:
          type: string
        direction:
          type: string
          enum: [debit, credit]
        amount:
          type: string
        currency:
          type: string
        running_balance:
          type: string
        description:
          type: string
        correlation_id:
          type: string
        posted_at:
          type: string
          format: date-time

    LedgerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AdjustmentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            wallet_id:
              type: string
              format: uuid
            adjustment_type:
              type: string
            amount:
              type: string
            currency:
              type: string
            reason:
              type: string
            status:
              type: string
              enum: [pending_approval, approved, rejected, posted]
            maker_id:
              type: string
              format: uuid
            checker_id:
              type: string
              format: uuid
              nullable: true
            ledger_transaction_id:
              type: string
              format: uuid
              nullable: true
            created_at:
              type: string
              format: date-time
            approved_at:
              type: string
              format: date-time
              nullable: true
            posted_at:
              type: string
              format: date-time
              nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
