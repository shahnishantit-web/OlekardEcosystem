openapi: 3.1.0
info:
  title: E27 Reliability Admin API
  version: 1.0.0
  description: |
    Dead-letter queue management and ledger integrity endpoints for platform operators.
    All endpoints require the `operations.dead_letter.manage` permission.

servers:
  - url: /v1

security:
  - BearerAuth: []

paths:
  /operations/dead-letter:
    get:
      summary: List dead-letter items
      operationId: listDeadLetterItems
      tags: [DeadLetter]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, replayed, dismissed]
          description: Filter by status (default all)
        - name: operation_type
          in: query
          schema:
            type: string
          description: Filter by operation type (e.g. funding.initiation)
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of created_at range (ISO 8601)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of created_at range (ISO 8601)
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated list of dead-letter items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/dead-letter/stats:
    get:
      summary: Dead-letter aggregate statistics
      operationId: getDeadLetterStats
      tags: [DeadLetter]
      responses:
        '200':
          description: Counts by status and operation type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/dead-letter/{id}:
    get:
      summary: Get a single dead-letter item
      operationId: getDeadLetterItem
      tags: [DeadLetter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dead-letter item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterItemResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/dead-letter/{id}/replay:
    post:
      summary: Replay a dead-letter item
      operationId: replayDeadLetterItem
      tags: [DeadLetter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: Optional operator note recorded with the replay audit entry
      responses:
        '200':
          description: Replay accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '409':
          description: Item is already replayed or dismissed, or a concurrent replay is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/dead-letter/{id}/dismiss:
    post:
      summary: Dismiss a dead-letter item
      operationId: dismissDeadLetterItem
      tags: [DeadLetter]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 1000
                  description: Operator-supplied justification for dismissal (required for audit trail)
      responses:
        '200':
          description: Item dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DismissResponse'
        '409':
          description: Item is not in pending status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/ledger-integrity/snapshots:
    get:
      summary: List ledger integrity scan snapshots
      operationId: listLedgerIntegritySnapshots
      tags: [LedgerIntegrity]
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated snapshots ordered by scan_at DESC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSnapshotListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DeadLetterItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operation_type:
          type: string
          example: funding.initiation
        source_id:
          type: string
          format: uuid
        failure_reason:
          type: string
        retry_count:
          type: integer
        status:
          type: string
          enum: [pending, replayed, dismissed]
        correlation_id:
          type: string
          nullable: true
        replayed_at:
          type: string
          format: date-time
          nullable: true
        replayed_by:
          type: string
          format: uuid
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    DeadLetterListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DeadLetterItem'
            pagination:
              $ref: '#/components/schemas/Pagination'
        error:
          nullable: true
        correlation_id:
          type: string

    DeadLetterItemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/DeadLetterItem'
            - type: object
              properties:
                retry_history:
                  type: array
                  items:
                    type: object
                    properties:
                      attempt:
                        type: integer
                      failed_at:
                        type: string
                        format: date-time
                      reason:
                        type: string
                payload:
                  type: object
                  description: Original operation payload (sensitive fields masked)
        error:
          nullable: true
        correlation_id:
          type: string

    DeadLetterStatsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            total_pending:
              type: integer
            total_replayed:
              type: integer
            total_dismissed:
              type: integer
            by_operation_type:
              type: array
              items:
                type: object
                properties:
                  operation_type:
                    type: string
                  pending:
                    type: integer
                  replayed:
                    type: integer
                  dismissed:
                    type: integer

    ReplayResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [replayed]
            replayed_at:
              type: string
              format: date-time
        correlation_id:
          type: string

    DismissResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [dismissed]
            dismissed_at:
              type: string
              format: date-time
        correlation_id:
          type: string

    LedgerIntegritySnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scan_at:
          type: string
          format: date-time
        wallets_checked:
          type: integer
        discrepancy_count:
          type: integer
        affected_wallet_ids:
          type: array
          items:
            type: string
            format: uuid
        outcome:
          type: string
          enum: [clean, discrepancy_found]
        duration_ms:
          type: integer
          nullable: true

    LedgerSnapshotListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LedgerIntegritySnapshot'
            pagination:
              $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        correlation_id:
          type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
