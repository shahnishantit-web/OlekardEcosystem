openapi: "3.1.0"
info:
  title: Community Services — Consent and Participant Preferences
  version: "1.0.0"
  description: >
    HZ04 Consent and Participant Preferences.
    Operational and marketing consent are separate purposes.
    Withdrawing marketing consent stops future marketing jobs.
    Cross-organiser sharing requires explicit approved purpose.

paths:
  /v1/community/consent:
    get:
      operationId: getMyConsent
      summary: Get current consumer consent state
      tags: [Consent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent state by purpose
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStateResponse"

    post:
      operationId: updateConsent
      summary: Grant or withdraw consent for a purpose
      tags: [Consent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsentRequest"
      responses:
        "200":
          description: Consent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStateResponse"

  /v1/community/data-rights:
    post:
      operationId: submitDataRightsRequest
      summary: Submit a data rights request (access, correction, deletion, portability)
      tags: [DataRights]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRightsRequest"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRightsResponse"

    get:
      operationId: listMyDataRightsRequests
      summary: List my data rights requests
      tags: [DataRights]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Data rights request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRightsListResponse"

  /v1/community/admin/consent/notices:
    get:
      operationId: listConsentNotices
      summary: List consent notice versions
      tags: [Admin, Consent]
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: query
          schema:
            type: string
            enum: [operational, marketing, sponsor_sharing, data_retention]
        - name: organisation_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Consent notice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentNoticeListResponse"

    post:
      operationId: createConsentNotice
      summary: Create a new consent notice version
      tags: [Admin, Consent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsentNoticeRequest"
      responses:
        "201":
          description: Consent notice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentNoticeResponse"

  /v1/community/admin/data-rights:
    get:
      operationId: adminListDataRightsRequests
      summary: Admin — list data rights requests
      tags: [Admin, DataRights]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Data rights request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRightsListResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ConsentPurpose:
      type: object
      properties:
        purpose:
          type: string
          enum: [operational, marketing, sponsor_sharing, data_retention]
        notice_id:
          type: string
          format: uuid
        notice_version:
          type: string
        granted:
          type: boolean
        last_updated_at:
          type: string
          format: date-time

    ConsentStateResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsentPurpose"

    UpdateConsentRequest:
      type: object
      required: [purpose, notice_id, action]
      properties:
        purpose:
          type: string
          enum: [marketing, sponsor_sharing]
          description: Only non-operational purposes are consumer-modifiable
        notice_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [grant, withdraw]

    DataRightsRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [access, correction, deletion, portability]
        notes:
          type: string
          nullable: true

    DataRightsItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [access, correction, deletion, portability]
        status:
          type: string
          enum: [received, in_progress, completed, rejected]
        reason:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    DataRightsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DataRightsItem"

    DataRightsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataRightsItem"

    ConsentNotice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
        version:
          type: string
        locale:
          type: string
        effective_from:
          type: string
          format: date-time
        superseded_at:
          type: string
          format: date-time
          nullable: true

    ConsentNoticeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ConsentNotice"

    ConsentNoticeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsentNotice"

    CreateConsentNoticeRequest:
      type: object
      required: [purpose, version, locale, effective_from]
      properties:
        organisation_id:
          type: string
          format: uuid
          nullable: true
        purpose:
          type: string
          enum: [operational, marketing, sponsor_sharing, data_retention]
        version:
          type: string
        locale:
          type: string
          default: en
        effective_from:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
              format: uuid
