openapi: "3.1.0"
info:
  title: Community Services — Membership and Tenant Context
  version: "1.0.0"
  description: >
    HZ03 Membership and Tenant Context.
    Staff invitations are single-use and expire. Membership in one organisation
    grants no access to another organisation's data.

paths:
  /v1/community/organisations/{org_id}/staff:
    get:
      operationId: listStaffMemberships
      summary: List staff memberships for an organisation
      tags: [Membership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, revoked]
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMembershipListResponse"

    post:
      operationId: inviteStaff
      summary: Invite a new staff member
      tags: [Membership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteStaffRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/community/organisations/{org_id}/staff/{membership_id}:
    patch:
      operationId: updateStaffMembership
      summary: Update staff role or scope; revoke access
      tags: [Membership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMembershipResponse"

  /v1/community/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept a staff invitation
      tags: [Membership]
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted; membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMembershipResponse"
        "404":
          description: Invitation not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation already accepted or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/community/memberships:
    get:
      operationId: listConsumerMemberships
      summary: List communities the current consumer belongs to
      tags: [Membership]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consumer community memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMembershipListResponse"

  /v1/community/communities/{community_id}/join:
    post:
      operationId: requestCommunityMembership
      summary: Request to join a community
      tags: [Membership]
      security:
        - bearerAuth: []
      parameters:
        - name: community_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Membership request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMembershipResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    StaffMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Membership ID (distinct from person ID)
        person_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [organiser_admin, community_representative, finance_approver, gate_operator, sponsor_partner, support_officer]
        scoped_to_event_id:
          type: string
          format: uuid
          nullable: true
        scoped_to_community_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, suspended, revoked]
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
          nullable: true

    StaffMembershipResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/StaffMembership"

    StaffMembershipListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffMembership"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    InviteStaffRequest:
      type: object
      required: [intended_email, role]
      properties:
        intended_email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum: [organiser_admin, community_representative, finance_approver, gate_operator, sponsor_partner, support_officer]
        scoped_to_event_id:
          type: string
          format: uuid
          nullable: true
        scoped_to_community_id:
          type: string
          format: uuid
          nullable: true
        effective_to:
          type: string
          format: date-time
          nullable: true

    InvitationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            organisation_id:
              type: string
              format: uuid
            intended_email:
              type: string
            role:
              type: string
            status:
              type: string
              enum: [pending, accepted, expired, revoked]
            expires_at:
              type: string
              format: date-time

    UpdateMembershipRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, revoked]
        role:
          type: string
        scoped_to_event_id:
          type: string
          format: uuid
          nullable: true
        effective_to:
          type: string
          format: date-time
          nullable: true

    ConsumerMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        community_id:
          type: string
          format: uuid
        community_name:
          type: string
        status:
          type: string
          enum: [pending, active, suspended, departed]
        joined_at:
          type: string
          format: date-time
          nullable: true

    ConsumerMembershipResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ConsumerMembership"

    ConsumerMembershipListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerMembership"

    PaginationMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        per_page:
          type: integer

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
              format: uuid

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
