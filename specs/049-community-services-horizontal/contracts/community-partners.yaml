openapi: "3.1.0"
info:
  title: Community Services — Partner Connectors
  version: "1.0.0"
  description: >
    HZ12 Partner Connectors and Configuration.
    Credentials are stored in a managed vault; only vault path references appear here.
    Webhooks are verified server-side before any processing.
    Partner-specific logic lives entirely in adapter classes; core domain is unaffected.

paths:
  /v1/community/admin/partners:
    get:
      operationId: listPartnerConnectors
      summary: List partner connectors
      tags: [Partners]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Partner connector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectorListResponse"

    post:
      operationId: registerPartnerConnector
      summary: Register a new partner connector (Platform Admin)
      tags: [Partners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPartnerRequest"
      responses:
        "201":
          description: Partner connector registered (sandbox_mode=true by default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/community/admin/partners/{id}:
    get:
      operationId: getPartnerConnector
      summary: Get partner connector detail
      tags: [Partners]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      responses:
        "200":
          description: Partner detail (no secrets returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectorResponse"

    patch:
      operationId: updatePartnerConnector
      summary: Update partner connector configuration
      tags: [Partners]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerRequest"
      responses:
        "200":
          description: Updated partner connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectorResponse"

  /v1/community/admin/partners/{id}/disable:
    post:
      operationId: disablePartnerConnector
      summary: Disable a partner connector immediately
      tags: [Partners]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Connector disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectorResponse"

  /v1/community/webhooks/{partner_key}:
    post:
      operationId: receiveWebhook
      summary: Receive webhook from partner (signature verified before processing)
      tags: [Webhooks]
      parameters:
        - name: partner_key
          in: path
          required: true
          schema:
            type: string
        - name: X-Partner-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of raw body + timestamp
        - name: X-Partner-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix timestamp; must be within freshness window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw partner webhook payload; schema is partner-specific
      responses:
        "202":
          description: Webhook received and queued for processing
        "400":
          description: Invalid signature or stale timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PartnerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    PartnerConnector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partner_key:
          type: string
        name:
          type: string
        adapter_class:
          type: string
        adapter_version:
          type: string
        capability_manifest:
          type: object
        sandbox_mode:
          type: boolean
        health_status:
          type: string
          enum: [healthy, degraded, down, unknown]
        last_health_check_at:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    PartnerConnectorResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PartnerConnector"

    PartnerConnectorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PartnerConnector"

    RegisterPartnerRequest:
      type: object
      required: [partner_key, name, adapter_class, adapter_version, capability_manifest, credential_vault_path]
      properties:
        partner_key:
          type: string
          maxLength: 50
          pattern: "^[a-z0-9_]+$"
        name:
          type: string
          maxLength: 100
        adapter_class:
          type: string
          description: Fully-qualified class name of adapter implementing PartnerAdapterContract
        adapter_version:
          type: string
        capability_manifest:
          type: object
        credential_vault_path:
          type: string
          description: Vault key reference only — no actual credential values
        webhook_secret_vault_path:
          type: string
          nullable: true
        organisation_mapping:
          type: object
          default: {}

    UpdatePartnerRequest:
      type: object
      properties:
        adapter_version:
          type: string
        capability_manifest:
          type: object
        organisation_mapping:
          type: object
        sandbox_mode:
          type: boolean
        enabled:
          type: boolean

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
              format: uuid

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
