openapi: "3.1.0"
info:
  title: P08 — Pending Accounting Admin Contract
  version: "1.0.0"
  description: |
    Contract for the read-only admin endpoint that lists payment intents
    with unresolved accounting status (pending_ledger or ledger_failed).
    Requires permission: payment.intents.admin

paths:
  /v1/admin/payment/intents/pending-accounting:
    get:
      operationId: listPendingAccountingIntents
      summary: List payment intents with unresolved accounting status
      description: |
        Returns all payment_intents where accounting_status IN
        ('pending_ledger', 'ledger_failed'). Results are ordered by
        succeeded_at ascending (oldest unresolved first).
      tags:
        - Payment Admin
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: accounting_status
          in: query
          description: Filter to a specific accounting status
          schema:
            type: string
            enum: [pending_ledger, ledger_failed]
        - name: X-Correlation-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of intents with unresolved accounting
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingAccountingIntent"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing payment.intents.admin permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    PendingAccountingIntent:
      type: object
      required:
        - id
        - amount_minor
        - currency_code
        - provider_code
        - accounting_status
        - accounting_repair_attempts
        - succeeded_at
        - seconds_since_capture
      properties:
        id:
          type: string
          format: uuid
          description: payment_intent_id (UUID v7)
        amount_minor:
          type: integer
          description: Payment amount in minor currency units
        currency_code:
          type: string
          description: ISO 4217 currency code
        provider_code:
          type: string
          description: Payment provider code (e.g., "wallet", "bank_transfer")
        accounting_status:
          type: string
          enum: [pending_ledger, ledger_failed]
        accounting_repair_attempts:
          type: integer
          minimum: 0
          description: Number of repair attempts made by RepairPendingAccountingJob
        ledger_repair_at:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp of the last repair attempt, or null if never attempted
        succeeded_at:
          type: string
          format: date-time
          description: UTC timestamp when the payment capture succeeded
        seconds_since_capture:
          type: integer
          description: Elapsed seconds since succeeded_at

    PaginationMeta:
      type: object
      required: [total, page, per_page, pages]
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        pages:
          type: integer

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
