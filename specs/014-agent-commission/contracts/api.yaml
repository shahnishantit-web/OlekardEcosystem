openapi: "3.1.0"
info:
  title: E14 Agent Commission API
  version: "1.0.0"
  description: |
    Commission rule management, commission calculation visibility, payout approval,
    and reversal endpoints for the OleKard Agent Commission module (E14).

servers:
  - url: /v1
    description: Primary API

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommissionId:
      name: commissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255

  schemas:
    # ─── Commission Rule ─────────────────────────────────────────────────────────
    CommissionRuleRequest:
      type: object
      required: [rule_type, rate, applies_to, valid_from]
      properties:
        rule_type:
          type: string
          enum: [flat, percentage]
          description: "flat = fixed minor units; percentage = basis points (e.g., 40 = 0.40%)"
        rate:
          type: integer
          minimum: 1
          description: Minor units (flat) or basis points (percentage)
        applies_to:
          type: string
          enum: [cash_in, cash_out, both]
        agent_tier:
          type: string
          maxLength: 50
          nullable: true
          description: Scope rule to agents with this tier label; null = applies to all agents
        valid_from:
          type: string
          format: date
          description: Inclusive start date (YYYY-MM-DD)
        valid_to:
          type: string
          format: date
          nullable: true
          description: Inclusive end date; null = open-ended

    CommissionRuleResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rule_type:
          type: string
          enum: [flat, percentage]
        rate:
          type: integer
        applies_to:
          type: string
          enum: [cash_in, cash_out, both]
        agent_tier:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, superseded, expired]
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommissionRuleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionRuleResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ─── Commission ──────────────────────────────────────────────────────────────
    CommissionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        transaction_type:
          type: string
          enum: [cash_in, cash_out]
        amount:
          type: integer
          description: Minor units
        currency_code:
          type: string
          example: BWP
        rule_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, paid, reversed]
        payout_id:
          type: string
          format: uuid
          nullable: true
        journal_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true

    CommissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PendingCommissionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionResource'
        pending_total:
          type: integer
          description: Aggregate total in minor units across all pending and approved commissions
        currency_code:
          type: string
          example: BWP
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CommissionReportResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionResource'
        totals_by_status:
          type: object
          additionalProperties:
            type: integer
          example: { pending: 1200, approved: 400, paid: 8000, reversed: 200 }
        totals_by_type:
          type: object
          additionalProperties:
            type: integer
          example: { cash_in: 6000, cash_out: 3800 }
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ─── Commission Payout ───────────────────────────────────────────────────────
    CommissionPayoutRequest:
      type: object
      required: [agent_id, commission_ids]
      properties:
        agent_id:
          type: string
          format: uuid
        commission_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: IDs of pending commissions to include in this payout batch

    CommissionPayoutResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        total_amount:
          type: integer
          description: Minor units
        currency_code:
          type: string
          example: BWP
        status:
          type: string
          enum: [approved, completed, deferred, failed, cancelled]
        approved_by:
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_by:
          type: string
          format: uuid
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        journal_id:
          type: string
          format: uuid
          nullable: true
        commission_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time

    # ─── Shared ──────────────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

paths:

  # ─── Commission Rules ─────────────────────────────────────────────────────────

  /commission-rules:
    post:
      summary: Create commission rule
      operationId: createCommissionRule
      tags: [Commission Rules]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionRuleRequest'
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionRuleResource'
        "400":
          description: Invalid rate or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: INVALID_COMMISSION_RATE, message: "Rate must be greater than zero." }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — requires commission.rules.create permission

    get:
      summary: List commission rules
      operationId: listCommissionRules
      tags: [Commission Rules]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, superseded, expired]
        - name: applies_to
          in: query
          schema:
            type: string
            enum: [cash_in, cash_out, both]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of commission rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionRuleListResponse'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — requires commission.rules.view permission

  /commission-rules/{ruleId}:
    get:
      summary: Get commission rule
      operationId: getCommissionRule
      tags: [Commission Rules]
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        "200":
          description: Commission rule
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionRuleResource'
        "404":
          description: Rule not found
        "403":
          description: Forbidden

    patch:
      summary: Update commission rule (supersede)
      operationId: updateCommissionRule
      tags: [Commission Rules]
      description: |
        Creates a new active rule version with the provided changes and transitions
        the existing rule to `superseded` status. All unchanged fields are carried
        forward from the existing rule.
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate:
                  type: integer
                  minimum: 1
                applies_to:
                  type: string
                  enum: [cash_in, cash_out, both]
                agent_tier:
                  type: string
                  nullable: true
                valid_from:
                  type: string
                  format: date
                valid_to:
                  type: string
                  format: date
                  nullable: true
      responses:
        "200":
          description: New rule version created; old rule superseded
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionRuleResource'
        "404":
          description: Rule not found
        "403":
          description: Forbidden

    delete:
      summary: Deactivate commission rule
      operationId: deactivateCommissionRule
      tags: [Commission Rules]
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        "200":
          description: Rule deactivated (status → expired)
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionRuleResource'
        "404":
          description: Rule not found
        "403":
          description: Forbidden

  # ─── Agent Commissions ────────────────────────────────────────────────────────

  /agents/{agentId}/commissions:
    get:
      summary: Commission report for agent
      operationId: getAgentCommissionReport
      tags: [Commissions]
      description: |
        Paginated, date-filtered, status-filtered, type-filtered report with totals
        by status and transaction type. Accessible by the owning agent (own data only)
        or by an admin (any agent).
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, paid, reversed]
        - name: transaction_type
          in: query
          schema:
            type: string
            enum: [cash_in, cash_out]
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter by created_at >= from
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter by created_at <= to
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Commission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionReportResponse'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — requires commission.view_own or commission.view_any

  /agents/{agentId}/commissions/pending:
    get:
      summary: Pending commissions with aggregate total
      operationId: getPendingCommissions
      tags: [Commissions]
      description: |
        Returns all pending and approved commissions for an agent with an aggregate
        `pending_total` in minor units. Accessible by the owning agent or admin.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Pending commissions with totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingCommissionsResponse'
        "403":
          description: Forbidden

  # ─── Commission Tier (Cross-module agent extension) ───────────────────────────

  /agents/{agentId}/commission-tier:
    patch:
      summary: Set agent commission tier
      operationId: setAgentCommissionTier
      tags: [Commissions]
      description: |
        Assigns or clears the agent's commission tier label. Used to scope
        tier-based commission rules to specific agent groups.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_tier:
                  type: string
                  maxLength: 50
                  nullable: true
                  description: Tier label (e.g., "standard", "premium"); null to remove tier
      responses:
        "200":
          description: Agent tier updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    format: uuid
                  agent_tier:
                    type: string
                    nullable: true
        "404":
          description: Agent not found
        "403":
          description: Forbidden — requires commission.tier.manage

  # ─── Commission Reversal ──────────────────────────────────────────────────────

  /commissions/{commissionId}/reverse:
    post:
      summary: Reverse a commission
      operationId: reverseCommission
      tags: [Commissions]
      description: |
        Posts compensating ledger entry and transitions commission to `reversed`.
        For paid commissions, also debits the agent's float wallet for the amount.
        Only `pending` and `paid` commissions can be reversed.
      parameters:
        - $ref: '#/components/parameters/CommissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Reason for reversal (required for audit log)
      responses:
        "200":
          description: Commission reversed
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionResource'
        "404":
          description: Commission not found
        "409":
          description: Commission cannot be reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: COMMISSION_ALREADY_REVERSED, message: "Commission is already reversed." }
        "403":
          description: Forbidden — requires commission.reverse

  # ─── Commission Payouts ───────────────────────────────────────────────────────

  /commission-payouts:
    post:
      summary: Approve and execute commission payout batch
      operationId: approveCommissionPayout
      tags: [Commission Payouts]
      description: |
        Atomically approves the specified pending commissions and immediately
        attempts execution. On success returns status `completed`. If the agent
        is suspended returns `deferred`. On ledger failure returns `failed`.
        Idempotent per `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPayoutRequest'
      responses:
        "201":
          description: Payout created (status reflects outcome)
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionPayoutResource'
        "400":
          description: Validation error (e.g., commission already processed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyProcessed:
                  value:
                    error: { code: COMMISSION_ALREADY_PROCESSED, message: "One or more commissions are not in pending status." }
                emptyBatch:
                  value:
                    error: { code: INVALID_PAYOUT_BATCH, message: "No valid commissions specified." }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — requires commission.payout.approve

  /commission-payouts/{payoutId}:
    get:
      summary: Get commission payout
      operationId: getCommissionPayout
      tags: [Commission Payouts]
      parameters:
        - $ref: '#/components/parameters/PayoutId'
      responses:
        "200":
          description: Commission payout
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionPayoutResource'
        "404":
          description: Payout not found
        "403":
          description: Forbidden

    delete:
      summary: Cancel deferred commission payout
      operationId: cancelCommissionPayout
      tags: [Commission Payouts]
      description: |
        Cancels a payout in `deferred` status. Transitions the payout to
        `cancelled` and reverts linked commissions (that are not `reversed`)
        back to `pending`. Posts no ledger entries.
      parameters:
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Payout cancelled
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommissionPayoutResource'
        "409":
          description: Payout cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: PAYOUT_CANCELLATION_NOT_ALLOWED, message: "Only deferred payouts can be cancelled." }
        "404":
          description: Payout not found
        "403":
          description: Forbidden — requires commission.payout.cancel

  # ─── Admin Cross-Agent Report ─────────────────────────────────────────────────

  /commissions/report:
    get:
      summary: Cross-agent commission report (admin)
      operationId: getCommissionReport
      tags: [Commissions]
      description: |
        Paginated commission records across all agents. Supports filtering by
        agent, status, transaction type, and date range. Returns totals by
        status and type.
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific agent
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, paid, reversed]
        - name: transaction_type
          in: query
          schema:
            type: string
            enum: [cash_in, cash_out]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Commission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionReportResponse'
        "403":
          description: Forbidden — requires commission.report.view
