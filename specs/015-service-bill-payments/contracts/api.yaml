openapi: 3.1.0
info:
  title: E15 — Service & Bill Payments API
  version: "1.0"
  description: |
    API contracts for the Service & Bill Payments module.
    All endpoints use the `/v1` prefix and return the standard OleKard response envelope.

servers:
  - url: /v1

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    StandardEnvelope:
      type: object
      required: [success, correlation_id]
      properties:
        success: { type: boolean }
        data: { type: object, nullable: true }
        error: { $ref: '#/components/schemas/ErrorBody', nullable: true }
        correlation_id: { type: string, format: uuid }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: SERVICE_NOT_FOUND }
        message: { type: string }
        details: { type: object, nullable: true }

    ServiceResource:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Botswana Power Corporation" }
        category: { type: string, enum: [UTILITIES, TELECOMS, TV, INTERNET, OTHER] }
        description: { type: string, nullable: true }
        required_fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              placeholder: { type: string }
              validation_regex: { type: string, nullable: true }
              max_length: { type: integer }
        fee_type: { type: string, enum: [flat, percentage] }
        fee_value: { type: integer, description: "Minor units (flat) or basis points (percentage)" }
        min_amount: { type: integer, description: "Minimum payment in minor units" }
        max_amount: { type: integer, description: "Maximum payment in minor units" }
        currency_code: { type: string, example: BWP }
        provider_code: { type: string }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }

    ServiceTransactionResource:
      type: object
      properties:
        id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        customer_reference: { type: string }
        account_name: { type: string, nullable: true }
        amount: { type: integer }
        fee_amount: { type: integer }
        total_amount: { type: integer }
        currency_code: { type: string }
        status:
          type: string
          enum: [initiated, pending_provider, completed, failed, timeout_pending_review, abandoned]
        journal_id: { type: string, format: uuid, nullable: true }
        provider_reference: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ServiceReceiptResource:
      type: object
      properties:
        id: { type: string, format: uuid }
        receipt_reference: { type: string }
        transaction_id: { type: string, format: uuid }
        service_name: { type: string }
        customer_reference: { type: string }
        provider_confirmation_reference: { type: string, nullable: true }
        amount: { type: integer }
        fee_amount: { type: integer }
        total_amount: { type: integer }
        currency_code: { type: string }
        issued_at: { type: string, format: date-time }

  parameters:
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }

security:
  - BearerAuth: []

paths:

  # ─────────────────────────────────────────────────
  # ADMIN: Service Catalog CRUD
  # ─────────────────────────────────────────────────

  /services/admin:
    get:
      summary: List all services (admin — includes inactive)
      operationId: adminListServices
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated service list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ServiceResource' }
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer }
        "401": { description: Unauthorized }
        "403": { description: Forbidden — requires service.manage permission }

    post:
      summary: Create a service
      operationId: adminCreateService
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, required_fields, fee_type, fee_value, min_amount, max_amount, provider_code]
              properties:
                name: { type: string, maxLength: 255 }
                category: { type: string, enum: [UTILITIES, TELECOMS, TV, INTERNET, OTHER] }
                description: { type: string, nullable: true }
                required_fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, label]
                    properties:
                      name: { type: string }
                      label: { type: string }
                      placeholder: { type: string }
                      validation_regex: { type: string, nullable: true }
                      max_length: { type: integer, default: 50 }
                fee_type: { type: string, enum: [flat, percentage] }
                fee_value: { type: integer, minimum: 0 }
                min_amount: { type: integer, minimum: 1 }
                max_amount: { type: integer }
                currency_code: { type: string, default: BWP }
                provider_code: { type: string }
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceResource' }
        "422": { description: Validation error }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }

  /services/admin/{serviceId}:
    get:
      summary: Get service by ID (admin)
      operationId: adminGetService
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceResource' }
        "404": { description: SERVICE_NOT_FOUND }

    patch:
      summary: Update service
      operationId: adminUpdateService
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                required_fields: { type: array }
                fee_type: { type: string, enum: [flat, percentage] }
                fee_value: { type: integer, minimum: 0 }
                min_amount: { type: integer, minimum: 1 }
                max_amount: { type: integer }
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceResource' }
        "404": { description: SERVICE_NOT_FOUND }
        "422": { description: Validation error }

  /services/admin/{serviceId}/deactivate:
    post:
      summary: Deactivate service
      operationId: adminDeactivateService
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Service deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardEnvelope' }
        "404": { description: SERVICE_NOT_FOUND }

  /services/admin/{serviceId}/reactivate:
    post:
      summary: Reactivate service
      operationId: adminReactivateService
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Service reactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardEnvelope' }
        "404": { description: SERVICE_NOT_FOUND }

  /services/admin/transactions/{transactionId}/resolve:
    post:
      summary: Force outcome on a timeout_pending_review transaction
      operationId: adminResolveTransaction
      tags: [Admin — Service Catalog]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, rationale]
              properties:
                outcome: { type: string, enum: [success, failure] }
                rationale: { type: string, maxLength: 500 }
                provider_reference: { type: string, nullable: true, description: "Required when outcome=success" }
      responses:
        "200":
          description: Transaction resolved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceTransactionResource' }
        "404": { description: TRANSACTION_NOT_FOUND }
        "422": { description: Transaction not in timeout_pending_review status }

  # ─────────────────────────────────────────────────
  # CUSTOMER: Service Discovery
  # ─────────────────────────────────────────────────

  /services:
    get:
      summary: List active services (customer)
      operationId: listServices
      tags: [Customer — Service Discovery]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: category
          in: query
          schema: { type: string, enum: [UTILITIES, TELECOMS, TV, INTERNET, OTHER] }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Active service list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ServiceResource' }
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer }
        "401": { description: Unauthorized }

  /services/{serviceId}:
    get:
      summary: Get active service details (customer)
      operationId: getService
      tags: [Customer — Service Discovery]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceResource' }
        "404": { description: SERVICE_NOT_FOUND }
        "401": { description: Unauthorized }

  # ─────────────────────────────────────────────────
  # CUSTOMER: Pre-Payment Validation
  # ─────────────────────────────────────────────────

  /services/{serviceId}/validate-reference:
    post:
      summary: Validate customer account reference with provider
      operationId: validateCustomerReference
      tags: [Customer — Pre-Payment Validation]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_reference]
              properties:
                customer_reference: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Reference valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          valid: { type: boolean }
                          account_name: { type: string, nullable: true }
                          customer_reference: { type: string }
        "422":
          description: INVALID_CUSTOMER_REFERENCE or PROVIDER_VALIDATION_TIMEOUT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardEnvelope' }
        "404": { description: SERVICE_NOT_FOUND }
        "401": { description: Unauthorized }

  /services/{serviceId}/calculate-fee:
    post:
      summary: Calculate service fee for a given amount
      operationId: calculateServiceFee
      tags: [Customer — Pre-Payment Validation]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1, description: "Payment amount in minor units" }
      responses:
        "200":
          description: Fee calculated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          amount: { type: integer }
                          fee_amount: { type: integer }
                          total_amount: { type: integer }
                          currency_code: { type: string }
        "422":
          description: AMOUNT_OUT_OF_RANGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardEnvelope' }
        "404": { description: SERVICE_NOT_FOUND }

  # ─────────────────────────────────────────────────
  # CUSTOMER: Payment Initiation
  # ─────────────────────────────────────────────────

  /services/{serviceId}/payments:
    post:
      summary: Initiate a service payment
      operationId: initiateServicePayment
      tags: [Customer — Payment]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_id, customer_reference, amount, currency_code]
              properties:
                wallet_id: { type: string, format: uuid }
                customer_reference: { type: string }
                account_name: { type: string, nullable: true, description: "Validated account name (from validate-reference)" }
                amount: { type: integer, minimum: 1 }
                currency_code: { type: string }
                step_up_token: { type: string, nullable: true, description: "Required if amount >= step-up threshold" }
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceTransactionResource' }
        "402":
          description: INSUFFICIENT_BALANCE
        "409":
          description: FEE_CHANGED — fee recalculated; new fee included in error details
        "422":
          description: Validation error (WALLET_NOT_ACTIVE, SERVICE_NOT_AVAILABLE, STEP_UP_REQUIRED, AMOUNT_OUT_OF_RANGE)
        "401": { description: Unauthorized }
        "403": { description: Forbidden — not the wallet owner }

  /services/payments/{transactionId}:
    get:
      summary: Get service transaction status
      operationId: getServiceTransaction
      tags: [Customer — Payment]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceTransactionResource' }
        "404": { description: TRANSACTION_NOT_FOUND }
        "403": { description: Forbidden — not the transaction owner }

  # ─────────────────────────────────────────────────
  # CUSTOMER: Receipt
  # ─────────────────────────────────────────────────

  /services/payments/{transactionId}/receipt:
    get:
      summary: Get receipt for a completed service payment
      operationId: getServiceReceipt
      tags: [Customer — Receipt]
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ServiceReceiptResource' }
        "404":
          description: RECEIPT_NOT_AVAILABLE — transaction not completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardEnvelope' }
        "403": { description: Forbidden }

  # ─────────────────────────────────────────────────
  # PROVIDER: Inbound Callback
  # ─────────────────────────────────────────────────

  /services/callback/{provider}:
    post:
      summary: Inbound provider outcome callback
      operationId: serviceProviderCallback
      tags: [Provider — Callback]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: mock }
        - name: X-Signature
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload; verified by ServiceProviderAdapter::verifyCallback()
      responses:
        "200":
          description: Callback accepted (processed or idempotent replay)
        "400":
          description: Invalid signature or unknown transaction
        "422":
          description: Malformed payload
