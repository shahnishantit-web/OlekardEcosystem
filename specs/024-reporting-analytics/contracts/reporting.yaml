openapi: "3.1.0"
info:
  title: E24 Reporting & Analytics API
  version: "1.0.0"
  description: |
    On-demand report generation, asynchronous job tracking, file export, and schedule management
    for the OleKard wallet ecosystem.

    Authorization: all endpoints require `identity.auth` JWT middleware.
    Per-endpoint permission requirements are documented in the security section of each operation.

servers:
  - url: /v1
    description: API v1

tags:
  - name: Catalogue
    description: Report type catalogue
  - name: Jobs
    description: Report job lifecycle management
  - name: Exports
    description: Export file generation and download
  - name: Schedules
    description: Recurring report schedule management

paths:

  # ── Catalogue ─────────────────────────────────────────────────────────────

  /reports/catalogue:
    get:
      operationId: listReportDefinitions
      summary: List available report types
      description: Returns all active report definitions with their filter schemas and required permissions.
      tags: [Catalogue]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalogue retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Jobs ──────────────────────────────────────────────────────────────────

  /reports/jobs:
    get:
      operationId: listReportJobs
      summary: List report jobs for the authenticated user
      description: Returns paginated report jobs owned by the current user. Super-admins may pass `user_id` to list another user's jobs.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, processing, complete, failed]
        - name: report_type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Job list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportJobSummary"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: submitReportJob
      summary: Submit a report generation request
      description: |
        Creates a new report job. The job is dispatched asynchronously; poll `GET /v1/reports/jobs/{id}` for status.

        **Permission required**: depends on `report_type` (see report catalogue).
        **Rate limit**: returns 429 if the user already has 3 jobs in `requested` or `processing` state.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReportJobRequest"
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportJobSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Row limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Concurrent job limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: CONCURRENT_JOB_LIMIT_EXCEEDED
                  message: "You already have 3 active report jobs. Wait for one to complete before submitting another."
                  meta:
                    active_count: 3
                    limit: 3

  /reports/jobs/{id}:
    get:
      operationId: getReportJob
      summary: Get a report job by ID
      description: Returns the full job record including result data when status is `complete`.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: cancelReportJob
      summary: Cancel a pending report job
      description: Cancels a job in `requested` state. Returns 409 if the job is already processing or complete.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Job cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Exports ───────────────────────────────────────────────────────────────

  /reports/jobs/{jobId}/exports:
    post:
      operationId: requestReportExport
      summary: Request an export for a completed report job
      description: |
        Creates an export job for the specified completed report. The export is generated asynchronously.
        Returns 409 if the job is not in `complete` status.
      tags: [Exports]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [csv, excel]
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not in complete state

  /reports/exports/{exportId}:
    get:
      operationId: getReportExport
      summary: Get export status and download URL
      description: |
        Returns the export record. When the export is ready, `download_url` is populated with a time-limited URL.
        The URL expires after the configured link TTL (default: 1 hour).
      tags: [Exports]
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export record retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Export file has been purged

  /reports/exports/{exportId}/regenerate-link:
    post:
      operationId: regenerateExportLink
      summary: Regenerate an expired download link (admin only)
      description: |
        Issues a new time-limited download token for a retained export file. Returns 410 if the file has been purged.

        **Permission required**: `admin.write`
      tags: [Exports]
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New download link issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Export file has been purged and cannot be regenerated

  # ── Schedules ─────────────────────────────────────────────────────────────

  /reports/schedules:
    get:
      operationId: listReportSchedules
      summary: List report schedules
      description: Returns schedules owned by the current user (or all schedules for super-admin). Requires `reports.schedule` permission.
      tags: [Schedules]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Schedules retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportSchedule"

    post:
      operationId: createReportSchedule
      summary: Create a report schedule
      description: Creates a new recurring report schedule. Requires `reports.schedule` permission.
      tags: [Schedules]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/schedules/{id}:
    get:
      operationId: getReportSchedule
      summary: Get a report schedule
      tags: [Schedules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Schedule retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateReportSchedule
      summary: Update a report schedule
      description: Updates filters, cadence, recipients, or notification settings. Requires `reports.schedule` permission and ownership (or super-admin).
      tags: [Schedules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportScheduleRequest"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deactivateReportSchedule
      summary: Deactivate a report schedule
      description: Sets schedule status to `inactive`. Does not delete the record or its run history.
      tags: [Schedules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Schedule deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/schedules/{id}/runs:
    get:
      operationId: listScheduleRuns
      summary: List run history for a report schedule
      tags: [Schedules]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Run history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleRun"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

# ── Components ────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            meta:
              type: object
              additionalProperties: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    ReportDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: "transaction-report"
        name:
          type: string
          example: "Transaction Report"
        description:
          type: string
        required_permission:
          type: string
          example: "admin.read"
        filter_schema:
          type: object
          description: JSON Schema describing accepted filter parameters

    SubmitReportJobRequest:
      type: object
      required: [report_type, filters]
      properties:
        report_type:
          type: string
          enum:
            - user-report
            - wallet-report
            - transaction-report
            - agent-report
            - commission-report
            - kyc-report
            - reconciliation-report
            - settlement-report
            - risk-report
            - financial-summary
        filters:
          type: object
          description: Filter parameters; validated against the report type's filter_schema
          properties:
            date_range_start:
              type: string
              format: date
            date_range_end:
              type: string
              format: date
          additionalProperties: true

    ReportJobSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        report_type:
          type: string
        status:
          type: string
          enum: [requested, processing, complete, failed]
        row_count:
          type: integer
          nullable: true
        failure_reason:
          type: string
          nullable: true
        as_of_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ReportJobDetail:
      allOf:
        - $ref: "#/components/schemas/ReportJobSummary"
        - type: object
          properties:
            filters:
              type: object
            result_data:
              type: object
              nullable: true
              description: Structured report results (present when status is complete)

    ReportExport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        format:
          type: string
          enum: [csv, excel]
        status:
          type: string
          enum: [pending, ready, purged]
        file_size_bytes:
          type: integer
          nullable: true
        row_count:
          type: integer
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true
          description: Time-limited pre-signed URL; NULL if export is still generating or has been purged
        token_expires_at:
          type: string
          format: date-time
          nullable: true
        file_retention_expires_at:
          type: string
          format: date-time
          nullable: true
        purged_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ReportSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        report_type:
          type: string
        name:
          type: string
        filters:
          type: object
        cadence:
          type: string
          enum: [daily, weekly, monthly]
        cadence_time:
          type: string
          format: time
          example: "06:00"
        email_notification_enabled:
          type: boolean
        recipients:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
                format: email
                nullable: true
        status:
          type: string
          enum: [active, inactive]
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateReportScheduleRequest:
      type: object
      required: [report_type, name, filters, cadence, cadence_time]
      properties:
        report_type:
          type: string
        name:
          type: string
          maxLength: 128
        filters:
          type: object
        cadence:
          type: string
          enum: [daily, weekly, monthly]
        cadence_time:
          type: string
          format: time
          description: UTC time for schedule execution
        cadence_day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Required for weekly cadence (0=Mon, 6=Sun)
        cadence_day_of_month:
          type: integer
          minimum: 1
          maximum: 28
          description: Required for monthly cadence
        email_notification_enabled:
          type: boolean
          default: false
        recipients:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
                format: email

    UpdateReportScheduleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        filters:
          type: object
        cadence:
          type: string
          enum: [daily, weekly, monthly]
        cadence_time:
          type: string
          format: time
        cadence_day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        cadence_day_of_month:
          type: integer
          minimum: 1
          maximum: 28
        email_notification_enabled:
          type: boolean
        recipients:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
                format: email

    ScheduleRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        triggered_at:
          type: string
          format: date-time
        job_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [dispatched, failed]
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
