name: customer
description: OleKard Customer mobile application
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  design_system:
    path: ../../wallet-ecosystem/packages/design-system
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.4
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
