l{font-size:11px;color:var(--muted);margin-top:4px}.activitytime{font-size:10px;color:#a0a8b5}.bottomgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.85fr);gap:16px}.tablecard{overflow:hidden}.tabletop{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 16px;gap:10px}.linkbtn{background:transparent;border:0;color:#4a60a4;font-size:11px;font-weight:650}.tabletools{padding:0 22px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.tabs{display:flex;gap:4px}.tab{border:0;background:transparent;border-radius:6px;padding:7px 11px;color:#7d8798;font-size:11px}.tab.active{background:#edf0f9;color:#415995;font-weight:650}.table-search{border:1px solid #e1e5ed;background:#fff;border-radius:7px;height:32px;padding:0 10px;width:190px;max-width:100%;outline-offset:1px}table{width:100%;border-collapse:collapse}th{text-align:left;background:#fafbfc;color:#8993a3;font-weight:650;font-size:10px;letter-spacing:.02em;padding:12px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:14px 22px;border-bottom:1px solid #f0f1f4;font-size:11px;white-space:nowrap}tr:last-child td{border-bottom:none}.tid{color:#8b94a3;font-size:10px;margin-top:4px}.amount{font-weight:680}.status{display:inline-flex;gap:6px;align-items:center;font-size:10px;font-weight:650;border-radius:5px;padding:5px 8px}.status.completed{color:#16845e;background:#eaf8f1}.status.pending{color:#a77625;background:#fff6e7}.status.failed{color:#c94d52;background:#fff0f0}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.quick{padding:22px}.quicklinks{display:grid;gap:9px;margin-top:21px}.quicklink{border:1px solid var(--line);border-radius:8px;background:white;text-align:left;padding:12px 13px;display:flex;justify-content:space-between;color:#4e5c72;font-size:12px}.quicklink:hover{background:#f8f9fc;border-color:#cbd4e8}.quicklink min-height:120px}.kpivalue{font-size:23px}.chart-card,.activity-card,.quick{padding:17px}.tabletop{padding:17px}.tabletools{padding:0 12px 12px}.tablewrap{overflow-x:auto}table{min-width:560px}th,td{padding:12px 14px}.section-grid{grid-template-columns:1fr}}@media(max-width:360px){.kpis{grid-template-columns:1fr}.pagetools{width:100%}.pagetools select{flex:1}}
</style>

<body>
<div class="app" id="app"><div class="screenveil" id="veil"></div>
<aside class="sidebar" aria-label="Main navigation"><div class="side-top"><div class="brand"><div class="brand-icon">O</div><span class="brand-name">OleKard <span style="color:#a4aab6;font-weight:450">/ Admin</span></span></div><button class="iconbutton" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">☷</button></div><nav class="side-scroll" id="nav"></nav><div class="side-bottom"><div class="avatar">AD</div><div class="account-label"><div class="username">Administrator</div><div class="role">Workspace Admin</div></div></div></aside>
<div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="iconbutton mobile-menu" id="mobilemenu" aria-label="Open navigation">☰</button><div class="crumbs">OleKard <span style="padding:0 8px">/</span> <strong id="crumb">Overview</strong></div></div><div class="top-actions"><button class="search-cta" id="globalSearch" aria-label="Navigate to Customers">⌕ <span style="font-size:12px">Search workspace...</span><span class="kbd">⌘ K</span></button><button class="iconbutton notification" id="notification" title="Notifications (demo)" aria-label="Notifications">♧<i class="header-dot"></i></button><div class="avatar" style="height:29px;width:29px;font-size:10px" title="Administrator">AD</div></div></header>
<main class="workspace" id="content"></main></div></div>
<script>
const state={page:'Overview',period:'7',tab:'All',query:''};
const groups=[['WORKSPACE',[['Overview','▦'],['Analytics','▥']]],['OPERATIONS',[['Customers','♙'],['Agents','♧'],['KYC Reviews','⬡'],['Wallets','▣'],['Transactions','⇄']]],['MANAGEMENT',[['Roles & Access','♜'],['Audit Logs','▤'],['Settings','⚙']]]];
const transactions=[{id:'TXN-90241',name:'Wallet transfer',details:'Customer payment',amount:2450,status:'Completed',date:'12 Oct, 10:42'},{id:'TXN-90240',name:'Agent cash-in',details:'Agent network',amount:1200,status:'Completed',date:'12 Oct, 09:18'},{id:'TXN-90239',name:'Utility payment',details:'Electricity service',amount:850,status:'Pending',date:'11 Oct, 16:24'},{id:'TXN-90238',name:'Wallet transfer',details:'Customer payment',amount:3100,status:'Failed',date:'11 Oct, 14:07'},{id:'TXN-90237',name:'Agent cash-out',details:'Agent network',amount:570,status:'Completed',date:'11 Oct, 11:30'},{id:'TXN-90236',name:'Merchant payment',details:'Retail purchase',amount:185,status:'Pending',date:'10 Oct, 17:02'}];
const periodData={'7':{volume:'P 1.28M',customers:'12,846',agents:'384',kyc:'42',chart:'M8 145 C 45 140 65 115 95 122 S 145 147 190 105 S 245 116 284 83 S 350 109 390 69 S 448 88 491 45 S 560 58 620 19',days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']},'30':{volume:'P 5.63M',customers:'13,122',agents:'402',kyc:'58',chart:'M8 150 C 45 150 65 130 95 134 S 145 100 190 117 S 245 92 284 100 S 350 69 390 78 S 448 38 491 59 S 560 28 620 13',days:['1 Oct','5 Oct','10 Oct','15 Oct','20 Oct','25 Oct','30 Oct']},'90':{volume:'P 16.4M',customers:'14,550',agents:'446',kyc:'65',chart:'M8 160 C 45 150 65 145 95 140 S 145 135 190 110 S 245 113 284 95 S 350 90 390 73 S 448 64 491 41 S 560 46 620 10',days:['Jul','Mid Jul','Aug','Mid Aug','Sep','Mid Sep','Oct']}};
function navRender(){document.getElementById('nav').innerHTML=groups.map(([heading,items])=>`<div class="nav-group"><div class="nav-heading">${heading}</div>${items.map(([name,icon])=>`<button class="navitem ${state.page===name?'active':''}" data-page="${name}" title="${name}" aria-current="${state.page===name?'page':'false'}"><span class="nav-icon">${icon}</span><span class="nav-label">${name}</span>${name==='KYC Reviews'?'<span class="count">42</span>':''}</button>`).join('')}</div>`).join('');document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.page)))}
function setPage(page){state.page=page;document.getElementById('crumb').textContent=page;document.getElementById('app').classList.remove('mobile-open');navRender();render()}
function rows(){let list=transactions.filter(x=>(state.tab==='All'||x.status===state.tab)&&(`${x.id} ${x.name} ${x.details} ${x.amount} ${x.status}`.toLowerCase().includes(state.query.toLowerCase())));let tbody=document.getElementById('rows');if(!tbody)return;tbody.innerHTML=list.length?list.map(x=>`<tr><td><strong>${x.name}</strong><div class="tid">${x.id} · ${x.details}</div></td><td class="amount">P ${x.amount.toLocaleString('en-US',{minimumFractionDigits:2})}</td><td><span class="status ${x.status.toLowerCase()}"><i class="dot"></i>${x.status}</span></td><td style="color:#8c96a6">${x.date}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No transactions match your filters.</td></tr>'}
function dashboard(){let p=periodData[state.period];return `<section class="pagetop"><div><div class="eyebrow">OPERATIONS / DASHBOARD</div><h1 class="title">Business overview</h1><p class="subtitle">Monitor your ecosystem performance and operational activity</p></div><div class="pagetools"><select id="period" class="control" aria-label="Reporting period"><option value="7" ${state.period==='7'?'selected':''}>Last 7 days</option><option value="30" ${state.period==='30'?'selected':''}>Last 30 days</option><option value="90" ${state.period==='90'?'selected':''}>Last 90 days</option></select><button class="control primary" id="report">↗ Export report</button></div></section>
<section class="kpis"><div class="card kpi"><div class="kpihead">Transaction volume <span class="kpiicon">⇄</span></div><div class="kpivalue">${p.volume}</div><div><span class="trend">↗ +12.8%</span><span class="trenddetail">vs previous period</span></div></div><div class="card kpi"><div class="kpihead">Active customers <span class="kpiicon">♙</span></div><div class="kpivalue">${p.customers}</div><div><span class="trend">↗ +8.2%</span><span class="trenddetail">vs previous period</span></div></div><div class="card kpi"><div class="kpihead">Active agents <span class="kpiicon">♧</span></div><div class="kpivalue">${p.agents}</div><div><span class="trend">↗ +4.1%</span><span class="trenddetail">vs previous period</span></div></div><div class="card kpi"><div class="kpihead">Pending KYC <span class="kpiicon">⬡</span></div><div class="kpivalue">${p.kyc}</div><div><span class="trend neutral">● Needs review</span><span class="trenddetail">action required</span></div></div></section>
<div class="charts"><section class="card chart-card"><div class="cardhead"><div><h2 class="cardtitle">Transaction activity</h2><p class="cardsub">Transaction volume trend · BWP</p></div><span style="color:#8b94a7;font-size:11px">● Volume</span></div><div class="chart-total">${p.volume}</div><div style="font-size:11px;color:#16845e">↗ +12.8% over previous period</div><svg class="chart-svg" viewBox="0 0 630 210" role="img" aria-label="Illustrative transaction trend for selected reporting period" preserveAspectRatio="none"><defs><linearGradient id="chartGradient" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#6f83be" stop-opacity=".21"/><stop offset="1" stop-color="#6f83be" stop-opacity="0"/></linearGradient></defs>${[30,75,120,165].map(y=>`<line x1="8" x2="620" y1="${y}" y2="${y}" stroke="#e9edf4" stroke-dasharray="3 5" />`).join('')}<path d="${p.chart} L620 190 L8 190 Z" fill="url(#chartGradient)"/><path d="${p.chart}" fill="none" stroke="#6179b9" stroke-width="3" stroke-linecap="round"/></svg><div class="chart-labels">${p.days.map(d=>`<span>${d}</span>`).join('')}</div></section>
<section class="card activity-card"><div class="cardhead"><div><h2 class="cardtitle">Operational activity</h2><p class="cardsub">Most recent system events</p></div><button class="linkbtn" data-go="Audit Logs">View all →</button></div><div class="activity"><div class="activitymark">✓</div><div class="activitybody"><div class="activitytitle">KYC request approved</div><div class="activitydetail">Customer verification completed</div></div><span class="activitytime">5m</span></div><div class="activity"><div class="activitymark">⇄</div><div class="activitybody"><div class="activitytitle">Wallet transfer completed</div><div class="activitydetail">Transaction TXN-90241</div></div><span class="activitytime">18m</span></div><div class="activity"><div class="activitymark">♙</div><div class="activitybody"><div class="activitytitle">New customer registered</div><div class="activitydetail">Registration pending review</div></div><span class="activitytime">1h</span></div><div class="activity"><div class="activitymark">!</div><div class="activitybody"><div class="activitytitle">Agent approval pending</div><div class="activitydetail">New agent onboarding request</div></div><span class="activitytime">3h</span></div></section></div>
<div class="bottomgrid"><section class="card tablecard"><div class="tabletop"><div><h2 class="cardtitle">Recent transactions</h2><p class="cardsub">Latest financial activities</p></div><button class="linkbtn" data-go="Transactions">View all →</button></div><div class="tabletools"><div class="tabs" role="tablist" aria-label="Transaction status">${['All','Completed','Pending','Failed'].map(s=>`<button class="tab ${state.tab===s?'active':''}" data-tab="${s}" role="tab" aria-selected="${state.tab===s}">${s}</button>`).join('')}</div><input id="transactionSearch" class="table-search" aria-label="Filter transactions" placeholder="⌕ Search transactions..." value="${state.query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" /></div><div class="tablewrap"><table><thead><tr><th>TRANSACTION</th><th>AMOUNT</th><th>STATUS</th><th>DATE</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card quick"><h2 class="cardtitle">Quick actions</h2><p class="cardsub">Frequently used operations</p><div class="quicklinks"><button class="quicklink" data-go="Customers"><span>＋ Manage customers</span><span>↗</span></button><button class="quicklink" data-go="KYC Reviews"><span>✓ Review KYC requests</span><span>↗</span></button><button class="quicklink" data-go="Agents"><span>♙ Manage agents</span><span>↗</span></button><button class="quicklink" data-go="Transactions"><span>⇄ View transactions</span><span>↗</span></button><button class="quicklink" data-go="Roles & Access"><span>⚙ Roles & permissions</span><span>↗</span></button></div></section></div><div class="demo-note">REFERENCE WIREFRAME · All figures are fictional sample data. Brand colors are placeholders to be mapped to existing OleKard tokens.</div>`}
function otherPage(){return `<section class="pagetop"><div><div class="eyebrow">OLEKARD / ${state.page.toUpperCase()}</div><h1 class="title">${state.page}</h1><p class="subtitle">Reusable page shell demonstration for the ${state.page.toLowerCase()} module.</p></div><div class="pagetools"><button class="control" id="back">← Back to overview</button></div></section><section class="card section-placeholder"><h2 class="cardtitle">${state.page} workspace</h2><p>This is a navigable layout shell, not a fabricated working module. Claude + Spec Kit should retain the real existing module content and APIs, placing them inside this consistent page structure.</p><div class="section-grid"><div class="section-chip"><strong>List view</strong><p>Place existing searchable, filterable module tables here.</p></div><div class="section-chip"><strong>Details & forms</strong><p>Use the shared page header, standard components, and authorization-aware actions.</p></div></div></section>`}
function render(){document.getElementById('content').innerHTML=state.page==='Overview'?dashboard():otherPage();const period=document.getElementById('period');if(period)period.addEventListener('change',e=>{state.period=e.target.value;render()});document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render()}));let search=document.getElementById('transactionSearch');if(search)search.addEventListener('input',e=>{state.query=e.target.value;rows()});document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.go)));document.getElementById('back')?.addEventListener('click',()=>setPage('Overview'));document.getElementById('report')?.addEventListener('click',()=>alert('Reference-only control. Connect this action to an authorized export API during implementation.'));rows()}
document.getElementById('collapse').addEventListener('click',()=>{if(matchMedia('(max-width: 640px)').matches){document.getElementById('app').classList.remove('mobile-open');return}document.getElementById('app').classList.toggle('collapsed');document.getElementById('collapse').setAttribute('aria-label',document.getElementById('app').classList.contains('collapsed')?'Expand sidebar':'Collapse sidebar')});document.getElementById('mobilemenu').addEventListener('click',()=>document.getElementById('app').classList.add('mobile-open'));document.getElementById('veil').addEventListener('click',()=>document.getElementById('app').classList.remove('mobile-open'));document.getElementById('globalSearch').addEventListener('click',()=>setPage('Customers'));document.getElementById('notification').addEventListener('click',()=>setPage('Audit Logs'));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('app').classList.remove('mobile-open');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setPage('Customers')}});navRender();render();
</script></body></html>
